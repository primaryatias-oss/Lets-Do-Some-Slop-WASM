name: fstar-dev
on:
  push:
    branches: [fstar-dev]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install F* release
        run: |
          curl -sL https://github.com/FStarLang/FStar/releases/download/v2026.09.27/fstar-v2026.09.27-Linux-x86_64.tar.gz -o fstar.tgz
          mkdir -p $HOME/fst && tar xzf fstar.tgz -C $HOME/fst
          echo "FST=$HOME/fst/fstar" >> $GITHUB_ENV
      - name: extract probe
        run: |
          cd core/fstar/probe
          F="$FST/bin/fstar.exe --lax --include . --cache_checked_modules --cache_dir _cache"
          $F Prim.fst 2>&1 | tail -15
          $F Test.fst 2>&1 | tail -15
          $F --codegen OCaml --extract_module Test Test.fst 2>&1 | tail -15
          ls -la . _cache 2>/dev/null | head -20
          echo "--- Test.ml"; cat Test.ml
