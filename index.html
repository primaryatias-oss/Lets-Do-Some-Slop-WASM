const Wd = {
  L: null, w: 0, tiles: null,
  coins: [], enemies: [], shots: [], platforms: [], springs: [], checks: [],
  goal: null, boss: null, doorMesh: null, doorCells: [],
  coinsTotal: 0,
};
const isSolid = (t) => t === 1 || t === 4;
function tileAt(tx, ty) {
  if (tx < 0 || tx >= Wd.w) return 1;
  if (ty < 0 || ty >= LEVEL_H) return 0;
  return Wd.tiles[ty * Wd.w + tx];
}

function moveBody(b, dt, dropThrough) {
  b.hitX = 0; b.hitY = 0;
  const hw = b.w / 2;
  b.x += b.vx * dt;
  const y0 = Math.floor(b.y + 0.02), y1 = Math.floor(b.y + b.h - 0.02);
  if (b.vx > 0) {
    const tx = Math.floor(b.x + hw);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx - hw - 1e-4; b.vx = 0; b.hitX = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x - hw);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx + 1 + hw + 1e-4; b.vx = 0; b.hitX = -1; break; }
  }
  const prevY = b.y;
  b.y += b.vy * dt;
  const x0 = Math.floor(b.x - hw + 1e-3), x1 = Math.floor(b.x + hw - 1e-3);
  b.onGround = false;
  if (b.vy <= 0) {
    const ty = Math.floor(b.y);
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (isSolid(t) || (t === 2 && !dropThrough && prevY >= ty + 1 - 0.02)) {
        b.y = ty + 1; b.vy = 0; b.onGround = true; b.hitY = -1; break;
      }
    }
  } else {
    const ty = Math.floor(b.y + b.h);
    for (let tx = x0; tx <= x1; tx++) {
      if (isSolid(tileAt(tx, ty))) { b.y = ty - b.h - 1e-4; b.vy = 0; b.hitY = 1; break; }
    }
  }
}

const boxHit = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------------------------------------------------------------------
   8. PARTICLES + POPUPS + SCREEN FX
   --------------------------------------------------------------------- */
const FX = (() => {
  const POOL = 320;
  const parts = [];
  const free = [];
  const group = new THREE.Group();
  scene.add(group);
  for (let i = 0; i < POOL; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false });
    const m = new THREE.Mesh(planeGeo, mat);
    m.visible = false; m.position.z = 3;
    group.add(m);
    free.push({ m, life: 0, max: 1, vx: 0, vy: 0, g: 0, size: 0.1, spin: 0, active: false, drag: 0, shrink: true });
  }
  const popups = [];
  const flashEl = $('flash');
  let flash = 0, shake = 0;

  return {
    shake: 0,
    emit(x, y, n, o = {}) {
      const colors = o.colors || [o.color || 0xffffff];
      for (let i = 0; i < n; i++) {
        const p = free.pop();
        if (!p) return;
        const a = (o.angle !== undefined ? o.angle : rndRange(0, TAU)) + rndRange(-(o.spread || 0), o.spread || 0);
        const sp = rndRange(o.speedMin !== undefined ? o.speedMin : 1, o.speed || 4);
        p.vx = Math.cos(a) * sp + (o.vx || 0);
        p.vy = Math.sin(a) * sp + (o.vy || 0);
        p.g = o.gravity !== undefined ? o.gravity : 14;
        p.drag = o.drag || 0;
        p.max = p.life = rndRange(o.lifeMin || 0.25, o.life || 0.6);
        p.size = rndRange(o.sizeMin || 0.08, o.size || 0.18);
        p.spin = rndRange(-6, 6);
        p.shrink = o.shrink !== false;
        p.m.position.set(x + rndRange(-(o.jx || 0), o.jx || 0), y + rndRange(-(o.jy || 0), o.jy || 0), 3 + (o.z || 0));
        p.m.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
        p.m.rotation.z = rndRange(0, TAU);
        p.m.visible = true;
        p.active = true;
        parts.push(p);
      }
    },
    update(dt) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        if (p.life <= 0) {
          p.m.visible = false; p.active = false;
          parts.splice(i, 1); free.push(p);
          continue;
        }
        p.vy -= p.g * dt;
        if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
        p.m.position.x += p.vx * dt;
        p.m.position.y += p.vy * dt;
        p.m.rotation.z += p.spin * dt;
        const k = p.life / p.max;
        const s = p.size * (p.shrink ? (0.3 + 0.7 * k) : 1);
        p.m.scale.set(s, s, 1);
        p.m.material.opacity = Math.min(1, k * 2.2);
      }
      // popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.t += dt; p.y += dt * 1.4;
        if (p.t > p.life) { p.el.remove(); popups.splice(i, 1); continue; }
        const sx = (p.x - cam.position.x) / view.w * window.innerWidth + window.innerWidth / 2;
        const sy = window.innerHeight / 2 - (p.y - cam.position.y) / view.h * window.innerHeight;
        p.el.style.left = sx + 'px'; p.el.style.top = sy + 'px';
        p.el.style.opacity = Math.min(1, (p.life - p.t) * 3);
      }
      this.shake = Math.max(0, this.shake - dt * 2.8);
      if (flash > 0) { flash = Math.max(0, flash - dt * 3.5); flashEl.style.opacity = flash * 0.6; }
    },
    popup(x, y, text, color = '#ffd23f') {
      const el = document.createElement('div');
      el.className = 'pop'; el.textContent = text; el.style.color = color;
      $('popups').appendChild(el);
      popups.push({ el, x, y, t: 0, life: 0.9 });
    },
    flash(v = 1) { flash = v; flashEl.style.opacity = v * 0.6; },
    clear() {
      while (parts.length) { const p = parts.pop(); p.m.visible = false; free.push(p); }
      while (popups.length) popups.pop().el.remove();
    },
  };
})();
function rndRange(a, b) { return a + Math.random() * (b - a); }

/* ---------------------------------------------------------------------
   9. LEVEL MESH  (all tiles merged into one draw call)
   --------------------------------------------------------------------- */
function buildLevelMesh(L) {
  const pos = [], uvs = [], idx = [];
  const rnd = mulberry32(L.def.seed * 7 + 1);
  let vi = 0;
  const N = 12, inset = 0.02 / (16 * N);
  const quad = (x, y, slot, z) => {
    pos.push(x, y, z, x + 1, y, z, x + 1, y + 1, z, x, y + 1, z);
    const u0 = slot / N + inset, u1 = (slot + 1) / N - inset;
    uvs.push(u0, 0, u1, 0, u1, 1, u0, 1);
    idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
    vi += 4;
  };
  const T = Art.T;
  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = 0; tx < L.w; tx++) {
      const t = L.tiles[ty * L.w + tx];
      if (t === 0) continue;
      if (t === 1) {
        const above = ty + 1 < LEVEL_H ? L.tiles[(ty + 1) * L.w + tx] : 0;
        const exposed = above !== 1;
        quad(tx, ty, exposed ? T.TOP : T.FILL, 0);
        if (exposed && ty >= 1 && above === 0 && rnd() < 0.2) quad(tx, ty + 1, T.D1 + Math.floor(rnd() * 3), -0.1);
      } else if (t === 2) quad(tx, ty, T.ONEWAY, 0.05);
      else if (t === 3) quad(tx, ty, T.SPIKE, 0.05);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const mat = new THREE.MeshBasicMaterial({ map: Art.S.atlas[L.def.theme], transparent: true, alphaTest: 0.5, depthWrite: false });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  worldGroup.add(mesh);
  return mesh;
}

/* ---------------------------------------------------------------------
   10. ENTITY FACTORIES
   --------------------------------------------------------------------- */
function clearWorld() {
  worldGroup.traverse((o) => { if (o.material && o.material.dispose) o.material.dispose(); if (o.geometry && o.geometry !== planeGeo) o.geometry.dispose(); });
  while (worldGroup.children.length) worldGroup.remove(worldGroup.children[0]);
  Wd.coins = []; Wd.enemies = []; Wd.shots = []; Wd.platforms = []; Wd.springs = []; Wd.checks = [];
  Wd.goal = null; Wd.boss = null; Wd.doorMesh = null; Wd.doorCells = [];
}

function addCoin(kind, x, y) {
  const S = Art.S;
  const mesh = makeSprite(kind === 'coin' ? S.coin[0] : kind === 'gem' ? S.gem : S.heart, kind === 'coin' ? 0.9 : 1, kind === 'coin' ? 0.9 : 1, 0.2);
  mesh.position.set(x, y, 0.2);
  Wd.coins.push({ kind, x, y, got: false, mesh, ph: Math.random() * 6, r: kind === 'coin' ? 0.55 : 0.65 });
  if (kind !== 'heart') Wd.coinsTotal += kind === 'gem' ? 5 : 1;
}

function addEnemy(kind, x, y) {
  const S = Art.S;
  const e = {
    kind, x, y, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, alive: true, t: Math.random() * 10,
    w: 0.8, h: 0.62, stomp: true, onGround: false, hitX: 0, hitY: 0, mesh: null, ox: x, oy: y, cd: 1 + Math.random(),
  };
  if (kind === 'slime') {
    e.mesh = makeSprite(S.slime, 1, 1, 0.3);
  } else if (kind === 'bat') {
    e.w = 0.75; e.h = 0.5; e.mesh = makeSprite(S.bat[0], 1, 1, 0.3);
  } else if (kind === 'saw') {
    e.w = 0.78; e.h = 0.78; e.stomp = false; e.mesh = makeSprite(S.saw, 1.1, 1.1, 0.3); e.dir = 1; e.vx = 3;
  } else if (kind === 'turret') {
    e.w = 0.9; e.h = 0.8; e.stomp = false; e.mesh = makeSprite(S.turret, 1, 1, 0.3);
  } else if (kind === 'boss') {
    e.w = 2.5; e.h = 2.3; e.stomp = true; e.hp = 8; e.state = 'sleep'; e.st = 0; e.inv = 0; e.hp0 = 8;
    e.mesh = makeSprite(S.boss, 3.1, 3.1, 0.3);
    e.dir = -1;
  }
  Wd.enemies.push(e);
  if (kind === 'boss') Wd.boss = e;
  return e;
}

function addPlatform(kind, tx, ty) {
  const top = ty + 0.75;
  const p = { kind, x: tx + 0.5, x0: tx + 0.5, top, top0: top, prevTop: top, dx: 0, dy: 0, w: kind === 'crumble' ? 1 : 3, solid: true, t: Math.random() * 6, state: 'idle', timer: 0, vy: 0, meshes: [], home: { x: tx + 0.5, top } };
  const theme = Wd.L.def.theme;
  const n = kind === 'crumble' ? 1 : 3;
  for (let i = 0; i < n; i++) {
    p.meshes.push(makeSprite(slotTex(theme, kind === 'crumble' ? Art.T.CRUMBLE : Art.T.MOVER), 1, 1, 0.25));
  }
  Wd.platforms.push(p);
  positionPlatform(p);
}
function positionPlatform(p) {
  const n = p.meshes.length;
  p.meshes.forEach((m, i) => m.position.set(p.x + (i - (n - 1) / 2), p.top - 0.5, 0.25));
}

function spawnSpecs(L) {
  const S = Art.S;
  for (const s of L.specs) {
    const cx = s.tx + 0.5, by = s.ty;
    switch (s.t) {
      case 'c': addCoin('coin', cx, by + 0.5); break;
      case 'g': addCoin('gem', cx, by + 0.5); break;
      case 'H': addCoin('heart', cx, by + 0.5); break;
      case 'E': addEnemy('slime', cx, by); break;
      case 'F': addEnemy('bat', cx, by + 0.5); break;
      case 'W': addEnemy('saw', cx, by + 0.02); break;
      case 'T': addEnemy('turret', cx, by); break;
      case 'J': {
        const m = makeSprite(S.spring[0], 1, 1, 0.2);
        m.position.set(cx, by + 0.5, 0.2);
        Wd.springs.push({ x: cx, y: by, mesh: m, t: 0 });
        break;
      }
      case 'm': addPlatform('h', s.tx, s.ty); break;
      case 'n': addPlatform('v', s.tx, s.ty); break;
      case 'x': addPlatform('crumble', s.tx, s.ty); break;
      case 'K': {
        const pole = makeSprite(S.flagPole, 1, 2, 0.1);
        pole.position.set(cx, by + 1, 0.1);
        const cloth = makeSprite(S.flagOff[0], 1, 1, 0.12);
        cloth.position.set(cx + 0.05, by + 1.35, 0.12);
        Wd.checks.push({ x: cx, y: by, on: false, cloth, t: Math.random() * 3 });
        break;
      }
    }
  }
  if (L.goal) addGoal(L.goal.x, L.goal.y);
  if (L.door) {
    const T = Art.T;
    const cells = [];
    for (let ty = L.door.y0; ty <= L.door.y1; ty++) {
      const m = makeSprite(slotTex(L.def.theme, T.DOOR), 1, 1, 0.4);
      m.position.set(L.door.x + 0.5, ty + 0.5, 0.4);
      m.visible = false;
      cells.push({ ty, mesh: m });
    }
    Wd.doorCells = cells;
  }
  if (L.bossSpec) {
    const b = addEnemy('boss', L.bossSpec.x, L.bossSpec.y);
    b.mesh.visible = false;
  }
}

function addGoal(x, y) {
  const mesh = makeSprite(Art.S.portal[0], 1.5, 2.25, 0.15);
  mesh.position.set(x, y + 1.1, 0.15);
  Wd.goal = { x, y, mesh, t: 0 };
}

function setDoor(closed) {
  const L = Wd.L;
  if (!L.door) return;
  for (const c of Wd.doorCells) {
    Wd.tiles[c.ty * Wd.w + L.door.x] = closed ? 4 : 0;
    c.mesh.visible = closed;
  }
}

/* ---------------------------------------------------------------------
   11. GAME STATE + PLAYER
   --------------------------------------------------------------------- */
const G = {
  state: 'boot',        // boot | title | play | pause | clearing | clear
  lvl: 0, time: 0, anim: 0,
  coins: 0, kills: 0, deaths: 0, score: 0, bossKilled: false,
  freeze: 0, checkpoint: { x: 3, y: 2 }, clearT: 0, attractT: 0,
  camX: 0, camY: 7, bossActive: false, respawnT: 0,
};

const P = {
  x: 0, y: 0, vx: 0, vy: 0, w: PLAYER.w, h: PLAYER.h, face: 1,
  onGround: false, hitX: 0, hitY: 0, prevY: 0,
  coyote: 0, buffer: 0, jumpsLeft: 1, wallDir: 0, wallGrace: 0, wallMem: 0, wallLock: 0,
  dashT: 0, dashCd: 0, dashDir: 1, airDashUsed: false,
  inv: 0, dropT: 0, hp: 3, maxHp: 3, dead: false, deadT: 0,
  riding: null, safe: { x: 0, y: 0 }, safeT: 0,
  sx: 1, sy: 1, runT: 0, mesh: null, trailT: 0, wasGround: false,
};

function resetPlayer(x, y) {
  Object.assign(P, {
    x, y, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, buffer: 0, jumpsLeft: 1, wallDir: 0, wallGrace: 0, wallLock: 0,
    dashT: 0, dashCd: 0, airDashUsed: false, inv: 0, dropT: 0, dead: false, deadT: 0, riding: null, sx: 1, sy: 1,
    safe: { x, y }, safeT: 0, prevY: y, wasGround: false,
  });
  if (P.mesh) P.mesh.visible = true;
}

function updatePlayer(dt) {
  const ax = Input.axis;
  P.prevY = P.y;
  P.inv = Math.max(0, P.inv - dt);
  P.dashCd -= dt; P.wallLock -= dt; P.buffer -= dt; P.dropT -= dt; P.wallGrace -= dt;

  if (Input.pressed.jump) { Input.pressed.jump = false; P.buffer = PLAYER.buffer; }
  const wantDash = Input.pressed.dash;
  if (wantDash) Input.pressed.dash = false;

  // ride moving platforms
  if (P.riding && P.riding.solid && P.vy <= 0) {
    P.x += P.riding.dx;
    P.y = P.riding.top;
  }

  // grounded bookkeeping (from last step's collision result)
  if (P.onGround) { P.coyote = PLAYER.coyote; P.jumpsLeft = 1; P.airDashUsed = false; }
  else P.coyote -= dt;

  // dash
  if (wantDash && P.dashCd <= 0 && !P.airDashUsed) {
    P.dashT = PLAYER.dashTime; P.dashCd = PLAYER.dashCooldown;
    P.dashDir = ax || P.face; P.face = P.dashDir;
    if (!P.onGround) P.airDashUsed = true;
    Snd.play('dash');
    FX.emit(P.x, P.y + 0.4, 8, { colors: [0x6fe7ff, 0xffffff], angle: P.dashDir > 0 ? Math.PI : 0, spread: 0.5, speed: 6, gravity: 0, life: 0.35 });
  }

  if (P.dashT > 0) {
    P.dashT -= dt;
    P.vx = P.dashDir * PLAYER.dashSpeed;
    P.vy = 0;
    P.trailT -= dt;
    if (P.trailT <= 0) {
      P.trailT = 0.025;
      FX.emit(P.x, P.y + 0.45, 1, { colors: [0x6fe7ff, 0xb8f4ff], speed: 0.6, life: 0.35, size: 0.34, sizeMin: 0.28, gravity: 0 });
    }
    if (P.dashT <= 0) P.vx = P.dashDir * PLAYER.maxSpeed;
  } else {
    // horizontal control
    if (P.wallLock <= 0) {
      const target = ax * PLAYER.maxSpeed;
      let acc;
      if (ax === 0) acc = P.onGround ? PLAYER.decelGround : PLAYER.decelAir;
      else {
        acc = P.onGround ? PLAYER.accelGround : PLAYER.accelAir;
        if (sign(P.vx) === -ax) acc *= 1.6;
      }
      P.vx = approach(P.vx, target, acc * dt);
      if (ax) P.face = ax;
    }

    // wall contact
    P.wallDir = 0;
    if (!P.onGround && ax !== 0) {
      const tx = Math.floor(P.x + ax * (P.w / 2 + 0.08));
      if (isSolid(tileAt(tx, Math.floor(P.y + 0.3))) || isSolid(tileAt(tx, Math.floor(P.y + 0.75)))) {
        P.wallDir = ax; P.wallGrace = 0.1; P.wallMem = ax;
      }
    }

    // jumping
    if (P.buffer > 0) {
      if (Input.held.down && P.onGround && tileAt(Math.floor(P.x), Math.floor(P.y - 0.05)) === 2) {
        P.dropT = 0.22; P.buffer = 0; P.y -= 0.06; P.onGround = false;
      } else if (P.coyote > 0) {
        P.vy = PLAYER.jumpV; P.buffer = 0; P.coyote = 0; P.onGround = false;
        P.sx = 0.75; P.sy = 1.3;
        Snd.play('jump');
        FX.emit(P.x, P.y + 0.05, 5, { colors: [0xffffff, 0xd9d0f5], angle: Math.PI / 2, spread: 1.4, speed: 3, life: 0.4, gravity: 3 });
      } else if (P.wallGrace > 0 && P.wallMem !== 0) {
        P.vx = -P.wallMem * PLAYER.wallJumpX; P.vy = PLAYER.wallJumpY;
        P.wallLock = PLAYER.wallLock; P.face = -P.wallMem; P.buffer = 0; P.wallGrace = 0;
        P.jumpsLeft = 1; P.airDashUsed = false;
        P.sx = 0.8; P.sy = 1.25;
        Snd.play('wall');
        FX.emit(P.x + P.wallMem * 0.3, P.y + 0.5, 6, { colors: [0xffffff], angle: P.wallMem > 0 ? Math.PI : 0, spread: 1, speed: 3, life: 0.4, gravity: 4 });
      } else if (P.jumpsLeft > 0) {
        P.vy = PLAYER.doubleV; P.jumpsLeft--; P.buffer = 0;
        P.sx = 0.8; P.sy = 1.25;
        Snd.play('double');
        FX.emit(P.x, P.y + 0.05, 10, { colors: [0x6fe7ff, 0xffffff], angle: -Math.PI / 2, spread: 1.2, speed: 4, life: 0.45, gravity: 2 });
      }
    }

    // gravity (variable height: release = heavier)
    const g = P.vy > 0 ? (Input.held.jump ? PLAYER.gravity : PLAYER.gravity * 2.4) : PLAYER.fallGravity;
    P.vy = Math.max(P.vy - g * dt, -PLAYER.maxFall);
    if (P.wallDir && P.vy < -PLAYER.wallSlide) {
      P.vy = -PLAYER.wallSlide;
      if (Math.random() < 0.3) FX.emit(P.x + P.wallDir * 0.3, P.y + 0.5, 1, { colors: [0xffffff], speed: 1, life: 0.3, gravity: -1, size: 0.1 });
    }
  }

  const vyPre = P.vy;
  moveBody(P, dt, P.dropT > 0);

  // platforms (one-way, carry)
  P.riding = null;
  if (vyPre <= 0 && P.dashT <= 0) {
    for (const p of Wd.platforms) {
      if (!p.solid) continue;
      if (Math.abs(P.x - p.x) < p.w / 2 + P.w / 2 - 0.08 && P.prevY >= p.prevTop - 0.12 && P.y <= p.top + 0.02 && P.y >= p.top - 0.6) {
        P.y = p.top; P.vy = 0; P.onGround = true; P.riding = p;
        if (p.kind === 'crumble' && p.state === 'idle') { p.state = 'shake'; p.timer = 0.45; }
        break;
      }
    }
  }

  // landing feedback
  if (P.onGround && !P.wasGround && vyPre < -9) {
    P.sx = 1.3; P.sy = 0.72;
    Snd.play('land');
    FX.emit(P.x, P.y + 0.05, 6, { colors: [0xffffff, 0xcfc4ee], angle: 0, spread: Math.PI, speed: 3.5, life: 0.35, gravity: 2 });
  }
  if (P.hitY === 1 && P.vy === 0) P.vy = -1;
  P.wasGround = P.onGround;

  // remember a safe respawn point
  if (P.onGround && !P.riding) {
    const ty = Math.floor(P.y) - 1;
    const solidUnder = (x) => isSolid(tileAt(Math.floor(x), ty));
    if (solidUnder(P.x - 0.6) && solidUnder(P.x + 0.6) && solidUnder(P.x - 1.6) && solidUnder(P.x + 1.6) && tileAt(Math.floor(P.x), Math.floor(P.y)) !== 3) {
      P.safeT += dt;
      if (P.safeT > 0.35) { P.safe.x = P.x; P.safe.y = P.y; }
    } else P.safeT = 0;
  } else P.safeT = 0;

  // spikes
  if (P.inv <= 0 && P.dashT <= 0) {
    const x0 = Math.floor(P.x - P.w / 2), x1 = Math.floor(P.x + P.w / 2);
    const y0 = Math.floor(P.y), y1 = Math.floor(P.y + P.h * 0.5);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (tileAt(tx, ty) === 3) {
          const sx0 = tx + 0.15, sx1 = tx + 0.85, sy1 = ty + 0.5;
          if (P.x + P.w / 2 > sx0 && P.x - P.w / 2 < sx1 && P.y < sy1) {
            if (hurtPlayer(tx + 0.5)) { P.vy = 15; P.vx = (P.x < tx + 0.5 ? -1 : 1) * 5; }
            ty = y1 + 1; break;
          }
        }
      }
    }
  }

  // fell into a pit
  if (P.y < -2.5) pitFall();
}

function hurtPlayer(srcX) {
  if (P.inv > 0 || P.dashT > 0 || P.dead) return false;
  P.hp--;
  P.inv = PLAYER.invuln;
  G.freeze = 0.08;
  FX.shake = 0.55;
  FX.flash(0.55);
  Snd.play('hurt');
  FX.emit(P.x, P.y + 0.5, 14, { colors: [0xff4f78, 0xffffff, 0xffd23f], speed: 7, life: 0.6 });
  P.vx = (P.x < srcX ? -1 : 1) * 8.5; P.vy = 12;
  P.wallLock = 0.18; P.dashT = 0;
  if (P.hp <= 0) killPlayer();
  return true;
}

function pitFall() {
  if (P.dead) return;
  P.hp--;
  Snd.play('hurt');
  FX.flash(0.5); FX.shake = 0.5;
  if (P.hp <= 0) { killPlayer(); return; }
  P.x = P.safe.x; P.y = P.safe.y + 0.05; P.vx = 0; P.vy = 0; P.inv = 2;
  FX.emit(P.x, P.y + 0.4, 12, { colors: [0xffffff, 0x6fe7ff], speed: 5, life: 0.5, gravity: 0 });
  popupAtPlayer('OOPS', '#ff8bd7');
}

function killPlayer() {
  P.dead = true; P.deadT = 0; P.hp = 0;
  G.deaths++;
  P.mesh.visible = false;
  Snd.play('die');
  FX.shake = 0.9;
  FX.emit(P.x, P.y + 0.5, 34, { colors: [0xff9d3c, 0xffffff, 0xff4f78, 0x3be0c8], speed: 9, life: 1, size: 0.24 });
}

function respawn() {
  const cp = G.checkpoint;
  resetPlayer(cp.x, cp.y);
  P.hp = P.maxHp; P.inv = 2;
  if (Wd.boss && G.bossActive) resetBoss();
  G.respawnT = 0;
  snapCamera();
  FX.emit(P.x, P.y + 0.5, 16, { colors: [0xffffff, 0x6fe7ff, 0xffd23f], speed: 6, life: 0.6, gravity: 0 });
}

function popupAtPlayer(txt, color) { FX.popup(P.x, P.y + 1.4, txt, color); }

/* ---------------------------------------------------------------------
   12. PLATFORMS, ENEMIES, SHOTS, BOSS
   --------------------------------------------------------------------- */
function updatePlatforms(dt) {
  for (const p of Wd.platforms) {
    p.prevTop = p.top; p.dx = 0; p.dy = 0;
    p.t += dt;
    if (p.kind === 'h') {
      const nx = p.x0 + Math.sin(p.t * 1.05) * 2.4;
      p.dx = nx - p.x; p.x = nx;
    } else if (p.kind === 'v') {
      const nt = p.top0 + (1 - Math.cos(p.t * 0.95)) / 2 * 5.0;
      p.dy = nt - p.top; p.top = nt;
    } else if (p.kind === 'crumble') {
      if (p.state === 'shake') {
        p.timer -= dt;
        if (p.timer <= 0) {
          p.state = 'fall'; p.solid = false; p.vy = 0;
          Snd.play('crumble');
          FX.emit(p.x, p.top, 12, { colors: [0xb98a5e, 0x7a5636, 0xf0cfa2], speed: 3, life: 0.7 });
        }
      } else if (p.state === 'fall') {
        p.vy -= 32 * dt; p.top += p.vy * dt;
        if (p.top < -3) { p.state = 'gone'; p.timer = 2.6; p.meshes.forEach((m) => { m.visible = false; }); }
      } else if (p.state === 'gone') {
        p.timer -= dt;
        if (p.timer <= 0) {
          p.state = 'idle'; p.solid = true; p.top = p.home.top; p.prevTop = p.top;
          p.meshes.forEach((m) => { m.visible = true; });
        }
      }
    }
    positionPlatform(p);
    if (p.state === 'shake') p.meshes.forEach((m) => { m.position.x += (Math.random() - 0.5) * 0.08; m.position.y += (Math.random() - 0.5) * 0.06; });
  }
}

function shoot(x, y, vx, vy, opts = {}) {
  const mesh = makeSprite(opts.purple ? Art.S.orbPurple : Art.S.orbRed, opts.size || 0.6, opts.size || 0.6, 0.35);
  mesh.position.set(x, y, 0.35);
  Wd.shots.push({ x, y, vx, vy, g: opts.g || 0, life: opts.life || 6, r: (opts.size || 0.6) * 0.36, mesh, purple: !!opts.purple });
}

function killEnemy(e, byDash) {
  e.alive = false;
  e.mesh.visible = false;
  G.kills++; G.score += 150;
  Snd.play('stomp');
  FX.emit(e.x, e.y + e.h / 2, 16, { colors: e.kind === 'slime' ? [0x6be36a, 0xc4ffbd, 0x38a04a] : [0x8a4fd8, 0xff4060, 0xffffff], speed: 7, life: 0.7 });
  FX.popup(e.x, e.y + 1, '+150', '#ffffff');
  if (byDash) FX.shake = Math.max(FX.shake, 0.3);
}

function updateEnemies(dt) {
  for (const e of Wd.enemies) {
    if (!e.alive) continue;
    e.t += dt;
    switch (e.kind) {
      case 'slime': {
        e.vy = Math.max(e.vy - 55 * dt, -25);
        e.vx = e.dir * 1.9;
        moveBody(e, dt, false);
        if (e.hitX !== 0) e.dir = -e.dir;
        else if (e.onGround) {
          const tx = Math.floor(e.x + e.dir * (e.w / 2 + 0.12)), ty = Math.floor(e.y - 0.1);
          const t = tileAt(tx, ty);
          if (!isSolid(t) && t !== 2) e.dir = -e.dir;
          else if (tileAt(tx, Math.floor(e.y + 0.1)) === 3) e.dir = -e.dir;
        }
        break;
      }
      case 'bat': {
        const near = Math.abs(P.x - e.ox) < 8;
        if (near && !P.dead) e.ox += sign(P.x - e.ox) * 0.9 * dt;
        const px = e.x;
        e.x = e.ox + Math.sin(e.t * 1.3) * 3.2;
        e.y = e.oy + Math.sin(e.t * 2.4) * 0.6;
        e.dir = sign(e.x - px) || e.dir;
        break;
      }
      case 'saw': {
        e.x += e.vx * dt;
        const ahead = Math.floor(e.x + sign(e.vx) * 0.5);
        const floorAhead = tileAt(ahead, Math.floor(e.y - 0.2));
        if (isSolid(tileAt(ahead, Math.floor(e.y + 0.4))) || (!isSolid(floorAhead) && floorAhead !== 2) || Math.abs(e.x - e.ox) > 3) {
          e.vx = -e.vx; e.x += e.vx * dt * 2;
        }
        e.mesh.rotation.z -= sign(e.vx) * dt * 9;
        break;
      }
      case 'turret': {
        e.dir = sign(P.x - e.x) || 1;
        e.cd -= dt;
        const dx = Math.abs(P.x - e.x), dy = Math.abs(P.y - e.y);
        if (e.cd <= 0 && dx < Math.min(13, view.w / 2 + 1) && dy < 7 && !P.dead) {
          e.cd = 2.2;
          shoot(e.x + e.dir * 0.6, e.y + 0.5, e.dir * 6.5, 0);
          Snd.play('shoot');
          FX.emit(e.x + e.dir * 0.7, e.y + 0.5, 4, { colors: [0xffd23f, 0xff7a3d], angle: e.dir > 0 ? 0 : Math.PI, spread: 0.6, speed: 4, life: 0.25, gravity: 0 });
        }
        break;
      }
      case 'boss': updateBoss(e, dt); break;
    }
  }
}

function updateShots(dt) {
  for (let i = Wd.shots.length - 1; i >= 0; i--) {
    const s = Wd.shots[i];
    s.life -= dt;
    s.vy -= s.g * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    let dead = s.life <= 0 || s.y < -3;
    if (!dead && isSolid(tileAt(Math.floor(s.x), Math.floor(s.y)))) {
      dead = true;
      FX.emit(s.x, s.y, 6, { colors: s.purple ? [0xe58bff, 0xffffff] : [0xff7a3d, 0xffd23f], speed: 4, life: 0.35 });
    }
    if (!dead && !P.dead && Math.abs(P.x - s.x) < P.w / 2 + s.r && s.y > P.y - s.r && s.y < P.y + P.h + s.r) {
      if (hurtPlayer(s.x)) dead = true;
      else if (P.dashT > 0) { /* phase through while dashing */ }
    }
    if (dead) {
      killMesh(s.mesh); Wd.shots.splice(i, 1);
    }
  }
}

/* ---- boss: The Great Blob ---- */
function startBoss() {
  const b = Wd.boss, spec = Wd.L.bossSpec;
  G.bossActive = true;
  setDoor(true);
  Snd.play('door');
  FX.shake = 0.8;
  b.x = spec.x; b.y = LEVEL_H + 1; b.vx = 0; b.vy = 0;
  b.state = 'intro'; b.hp = b.hp0; b.inv = 0; b.alive = true;
  b.mesh.visible = true;
  $('bossbar').style.display = 'block';
  updateBossBar();
}

function resetBoss() {
  const b = Wd.boss;
  G.bossActive = false;
  b.state = 'sleep'; b.hp = b.hp0; b.alive = true; b.mesh.visible = false; b.inv = 0;
  setDoor(false);
  $('bossbar').style.display = 'none';
  for (const s of Wd.shots) killMesh(s.mesh);
  Wd.shots = [];
}

function updateBossBar() {
  const b = Wd.boss;
  if (b) $('bossFill').style.width = Math.max(0, b.hp / b.hp0 * 100) + '%';
}

function damageBoss() {
  const b = Wd.boss;
  if (b.inv > 0 || b.state === 'intro' || b.state === 'dying') return false;
  b.hp--; b.inv = 1.1;
  Snd.play('bossHit');
  G.freeze = 0.1; FX.shake = 0.8; FX.flash(0.5);
  FX.emit(b.x, b.y + 1.2, 22, { colors: [0xe58bff, 0xffffff, 0xb04fe8], speed: 9, life: 0.8, size: 0.26 });
  FX.popup(b.x, b.y + 3, b.hp > 0 ? 'HP ' + b.hp : 'K.O.!', '#ff8bd7');
  updateBossBar();
  if (b.hp <= 0) {
    b.state = 'dying'; b.st = 1.8; b.vx = 0;
    for (const s of Wd.shots) { FX.emit(s.x, s.y, 5, { colors: [0xffffff, 0xe58bff], speed: 4 }); killMesh(s.mesh); }
    Wd.shots = [];
  }
  return true;
}

function updateBoss(b, dt) {
  if (b.state === 'sleep') return;
  b.inv = Math.max(0, b.inv - dt);
  b.st -= dt;
  const dx = P.x - b.x;
  const lowHp = b.hp <= 3;
  switch (b.state) {
    case 'intro':
      b.vy = Math.max(b.vy - 60 * dt, -30);
      moveBody(b, dt, false);
      if (b.onGround) {
        b.state = 'idle'; b.st = 1.0;
        Snd.play('boom'); FX.shake = 1;
        FX.emit(b.x, b.y, 24, { colors: [0xcfc4ee, 0xffffff], angle: 0, spread: Math.PI, speed: 8, life: 0.6, gravity: 3 });
      }
      break;
    case 'idle':
      b.dir = sign(dx) || 1;
      b.vx = 0; b.vy = -2;
      moveBody(b, dt, false);
      if (b.st <= 0) {
        const r = Math.random();
        if (r < 0.5) { b.state = 'jump'; b.vy = 25; b.vx = clamp(dx / 1.2, -11, 11); Snd.play('spring'); }
        else if (r < 0.8) { b.state = 'shoot'; b.st = 0.5; b.shots = lowHp ? 5 : 3; }
        else { b.state = 'charge'; b.st = 1.3; b.dir = sign(dx) || 1; }
      }
      break;
    case 'jump':
      b.vy = Math.max(b.vy - 62 * dt, -30);
      moveBody(b, dt, false);
      if (b.hitX) b.vx = 0;
      if (b.onGround) {
        b.state = 'recover'; b.st = lowHp ? 0.8 : 1.2; b.vx = 0;
        Snd.play('boom'); FX.shake = 1;
        FX.emit(b.x, b.y, 20, { colors: [0xcfc4ee, 0xffffff], angle: 0, spread: Math.PI, speed: 8, life: 0.5, gravity: 3 });
        shoot(b.x - 1.3, b.y + 0.35, -7, 0, { purple: true, size: 0.7, life: 4 });
        shoot(b.x + 1.3, b.y + 0.35, 7, 0, { purple: true, size: 0.7, life: 4 });
      }
      break;
    case 'recover':
      b.vx = 0; b.vy = -2;
      moveBody(b, dt, false);
      if (b.st <= 0) { b.state = 'idle'; b.st = lowHp ? 0.35 : 0.7; }
      break;
    case 'shoot':
      b.vx = 0; b.vy = -2; moveBody(b, dt, false);
      b.dir = sign(dx) || 1;
      if (b.st <= 0 && b.shots > 0) {
        const ang = Math.atan2(P.y + 0.4 - (b.y + 1.4), P.x - b.x) + (Math.random() - 0.5) * 0.35;
        shoot(b.x + b.dir * 1.1, b.y + 1.4, Math.cos(ang) * 7.5, Math.sin(ang) * 7.5, { purple: true, size: 0.6, life: 5 });
        Snd.play('shoot');
        b.shots--; b.st = 0.3;
      } else if (b.shots <= 0 && b.st <= 0) { b.state = 'idle'; b.st = 0.7; }
      break;
    case 'charge':
      b.vy = Math.max(b.vy - 60 * dt, -30);
      if (b.st > 0.75) b.vx = 0; // telegraph
      else b.vx = b.dir * (lowHp ? 15 : 12);
      moveBody(b, dt, false);
      if (b.st <= 0.75 && b.hitX) {
        b.state = 'recover'; b.st = 1.3; b.vx = 0;
        Snd.play('boom'); FX.shake = 1;
        FX.emit(b.x + b.dir * 1.2, b.y + 1, 18, { colors: [0xcfc4ee, 0xffffff], speed: 8, life: 0.5 });
      } else if (b.st <= 0) { b.state = 'recover'; b.st = 0.8; b.vx = 0; }
      break;
    case 'dying':
      b.vx = 0;
      if (Math.random() < 0.5) FX.emit(b.x + rndRange(-1.2, 1.2), b.y + rndRange(0, 2.4), 6, { colors: [0xffd23f, 0xff7a3d, 0xffffff, 0xe58bff], speed: 7, life: 0.6, size: 0.3 });
      FX.shake = Math.max(FX.shake, 0.5);
      if (b.st <= 0) {
        b.alive = false; b.mesh.visible = false;
        Snd.play('boom'); FX.flash(1); FX.shake = 1.2;
        FX.emit(b.x, b.y + 1.2, 60, { colors: [0xffd23f, 0xff7a3d, 0xffffff, 0xe58bff, 0x6fe7ff], speed: 12, life: 1.2, size: 0.34 });
        G.score += 3000; G.bossKilled = true; G.bossActive = false;
        $('bossbar').style.display = 'none';
        setDoor(false);
        addGoal(b.x, 2);
        FX.popup(b.x, b.y + 3, 'BOSS DEFEATED!', '#ffd23f');
      }
      break;
  }
}

/* ---------------------------------------------------------------------
   13. INTERACTIONS: enemies, items, springs, checkpoints, goal
   --------------------------------------------------------------------- */
function stompBounce(strong) {
  P.vy = Input.held.jump ? PLAYER.stompBounce + 3.5 : PLAYER.stompBounce;
  if (strong) P.vy += 2;
  P.jumpsLeft = 1; P.airDashUsed = false; P.onGround = false; P.dashT = 0;
  P.sx = 0.8; P.sy = 1.25;
}

function updateInteractions(dt) {
  if (P.dead) return;
  // enemies
  for (const e of Wd.enemies) {
    if (!e.alive || (e.kind === 'boss' && (e.state === 'sleep' || e.state === 'dying'))) continue;
    if (!boxHit(P, e)) continue;
    if (e.kind === 'boss') {
      if (P.vy < 0 && P.prevY >= e.y + e.h * 0.55 && P.dashT <= 0) {
        if (damageBoss()) stompBounce(true);
        else P.vy = Math.max(P.vy, 8);
      } else hurtPlayer(e.x);
    } else if (!e.stomp) {
      hurtPlayer(e.x);
    } else if (P.dashT > 0) {
      killEnemy(e, true);
    } else if (P.vy < 0 && P.prevY >= e.y + e.h * 0.5) {
      killEnemy(e, false);
      stompBounce(false);
      G.freeze = 0.04;
    } else hurtPlayer(e.x);
  }

  // coins & pickups
  for (const c of Wd.coins) {
    if (c.got) continue;
    if (Math.abs(P.x - c.x) < c.r + P.w / 2 && Math.abs(P.y + 0.45 - c.y) < c.r + 0.45) {
      if (c.kind === 'heart') {
        if (P.hp >= P.maxHp) { G.score += 250; FX.popup(c.x, c.y + 0.5, '+250', '#ff8bd7'); }
        else { P.hp++; FX.popup(c.x, c.y + 0.5, '+1 HP', '#ff8bd7'); }
        Snd.play('heart');
        FX.emit(c.x, c.y, 12, { colors: [0xff4f78, 0xffc0d0], speed: 5, life: 0.6, gravity: 0 });
      } else if (c.kind === 'gem') {
        G.coins += 5; G.score += 500;
        Snd.play('gem');
        FX.popup(c.x, c.y + 0.5, '+5', '#6fe7ff');
        FX.emit(c.x, c.y, 16, { colors: [0x3fd4ff, 0xb8f4ff, 0xffffff], speed: 6, life: 0.6, gravity: 0 });
      } else {
        G.coins++; G.score += 100;
        Snd.play('coin');
        FX.emit(c.x, c.y, 6, { colors: [0xffd23f, 0xfff2a8], speed: 4, life: 0.4, gravity: 0 });
      }
      c.got = true; c.mesh.visible = false;
    }
  }

  // springs
  for (const s of Wd.springs) {
    if (Math.abs(P.x - s.x) < 0.7 && P.y >= s.y - 0.1 && P.y < s.y + 0.55 && P.vy <= 0.5) {
      P.vy = 31; P.onGround = false; P.jumpsLeft = 1; P.airDashUsed = false; P.dashT = 0; P.coyote = 0;
      P.sx = 0.7; P.sy = 1.4;
      s.t = 0.3;
      Snd.play('spring');
      FX.emit(s.x, s.y + 0.4, 10, { colors: [0xff5d8f, 0xffffff], angle: Math.PI / 2, spread: 0.9, speed: 6, life: 0.4 });
    }
  }

  // checkpoints
  for (const c of Wd.checks) {
    if (!c.on && Math.abs(P.x - c.x) < 1.3 && Math.abs(P.y - c.y) < 2) {
      Wd.checks.forEach((o) => { o.on = false; });
      c.on = true;
      G.checkpoint = { x: c.x, y: c.y };
      Snd.play('check');
      FX.popup(c.x, c.y + 2.4, 'CHECKPOINT', '#5be37d');
      FX.emit(c.x, c.y + 1.4, 20, { colors: [0x5be37d, 0xffffff, 0xffd23f], speed: 6, life: 0.7 });
    }
  }

  // boss trigger
  if (Wd.boss && Wd.boss.state === 'sleep' && Wd.boss.alive && P.x > Wd.L.bossSpec.trigger) startBoss();

  // goal
  if (Wd.goal && Math.abs(P.x - Wd.goal.x) < 0.9 && Math.abs(P.y + 0.5 - (Wd.goal.y + 1.1)) < 1.5) completeLevel();
}

/* ---------------------------------------------------------------------
   14. LEVEL FLOW
   --------------------------------------------------------------------- */
let levelMesh = null;

function loadLevel(i, attract) {
  clearWorld();
  FX.clear();
  const L = buildLevel(i);
  Wd.L = L; Wd.w = L.w; Wd.tiles = L.tiles; Wd.coinsTotal = 0;
  G.lvl = i;
  buildBackground(L.def.theme);
  resize();
  levelMesh = buildLevelMesh(L);
  spawnSpecs(L);
  if (!P.mesh || !P.mesh.parent) {
    P.mesh = makeSprite(Art.S.hero.idle, 1, 1, 0.5);
  }
  Object.assign(G, { time: 0, coins: 0, kills: 0, deaths: 0, score: 0, bossKilled: false, bossActive: false, freeze: 0, respawnT: 0 });
  G.checkpoint = { x: L.spawn.x, y: L.spawn.y };
  P.hp = P.maxHp;
  resetPlayer(L.spawn.x, L.spawn.y);
  if (attract) { P.dead = true; P.mesh.visible = false; }
  $('bossbar').style.display = 'none';
  snapCamera();
  Snd.startMusic(L.def.theme);
}

function startLevel(i) {
  Snd.init();
  Snd.play('click');
  loadLevel(i, false);
  G.state = 'play';
  hideScreen();
  $('hud').style.display = 'flex';
  $('hLevel').textContent = (i + 1) + '/' + LEVELS.length + ' ' + LEVELS[i].name.toUpperCase();
  FX.popup(P.x, P.y + 2.6, LEVELS[i].name.toUpperCase(), '#ffd23f');
}

function completeLevel() {
  if (G.state !== 'play') return;
  G.state = 'clearing';
  G.clearT = 1.5;
  P.vx = 0;
  Snd.play('win');
  FX.flash(0.6);
  for (let k = 0; k < 4; k++) {
    FX.emit(P.x + rndRange(-2, 2), P.y + 2.5, 20, { colors: [0xffd23f, 0xff5d8f, 0x6fe7ff, 0x5be37d, 0xffffff], angle: Math.PI / 2, spread: 1.4, speed: 10, life: 1.4, size: 0.2, gravity: 10 });
  }
  $('bossbar').style.display = 'none';
}

function rankFor(pts) { return pts >= 85 ? 'S' : pts >= 68 ? 'A' : pts >= 50 ? 'B' : 'C'; }

function showClear() {
  G.state = 'clear';
  const par = Wd.w * 0.3;
  const timeBonus = Math.max(0, Math.floor(par * 2 - G.time)) * 10;
  const total = Math.max(0, G.score + timeBonus - G.deaths * 200);
  const coinPct = G.coins / Math.max(1, Wd.coinsTotal);
  const timeScore = clamp((par * 1.8 - G.time) / (par * 0.8), 0, 1);
  const pts = coinPct * 55 + timeScore * 30 + (G.deaths === 0 ? 15 : G.deaths < 3 ? 7 : 0);
  const rank = rankFor(pts);
  const best = store.get('best', {});
  const prev = best[G.lvl];
  const isBest = !prev || total > prev.score;
  if (isBest) { best[G.lvl] = { score: total, time: G.time, rank }; store.set('best', best); }
  const last = G.lvl >= LEVELS.length - 1;
  showScreen(`<div class="panel">
    <h2>${last ? 'YOU BEAT THE GREAT BLOB!' : 'LEVEL CLEAR!'}</h2>
    <p class="sub">${LEVELS[G.lvl].name}</p>
    <div class="rank">${rank}</div>
    <div class="stats">
      <span>TIME</span><span>${fmtTime(G.time)}</span>
      <span>COINS</span><span>${G.coins} / ${Wd.coinsTotal}</span>
      <span>SLOPS SQUASHED</span><span>${G.kills}</span>
      <span>OOPSIES</span><span>${G.deaths}</span>
      <span>TIME BONUS</span><span>+${timeBonus}</span>
      <span>SCORE</span><span>${total}${isBest ? ' NEW BEST!' : ''}</span>
    </div>
    <div class="btns">
      ${last ? '<button class="pix" data-a="menu">Back to title</button>' : '<button class="pix" data-a="next">Next level</button>'}
      <button class="pix alt" data-a="retry">Replay</button>
      ${last ? '' : '<button class="pix alt" data-a="menu">Menu</button>'}
    </div>
    ${last ? '<p class="sub">Thanks for playing this slop. Now go touch grass.</p>' : ''}
  </div>`);
}

/* ---------------------------------------------------------------------
   15. SCREENS
   --------------------------------------------------------------------- */
const ACTIONS = {
  next()   { startLevel(Math.min(G.lvl + 1, LEVELS.length - 1)); },
  retry()  { startLevel(G.lvl); },
  menu()   { showTitle(); },
  resume() { togglePause(); },
  mute()   { toggleMute(); },
};
function showScreen(html) {
  const el = $('screen');
  el.innerHTML = html;
  el.classList.remove('hidden');
  el.querySelectorAll('[data-a]').forEach((b) => {
    b.addEventListener('click', () => {
      Snd.init();
      const a = b.dataset.a;
      if (a.startsWith('start:')) startLevel(parseInt(a.slice(6), 10));
      else if (ACTIONS[a]) ACTIONS[a]();
    });
  });
  const first = el.querySelector('button');
  if (first) first.blur();
}
function hideScreen() { $('screen').classList.add('hidden'); }

function showTitle() {
  loadLevel(0, true);
  G.state = 'title';
  G.attractT = 0;
  $('hud').style.display = 'none';
  const best = store.get('best', {});
  const lvlBtns = LEVELS.map((l, i) => {
    const b = best[i];
    return `<button class="pix" data-a="start:${i}">${i + 1}. ${l.name}${b ? ' [' + b.rank + ']' : ''}</button>`;
  }).join('');
  showScreen(`<div class="panel">
    <h1>SLOP<br>RUNNER</h1>
    <p class="sub">A 2D platformer proof of concept<br>one HTML file / three.js / zero assets</p>
    <div class="keys">
      <span><kbd>A</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&rarr;</kbd></span><span>Run</span>
      <span><kbd>SPACE</kbd> / <kbd>W</kbd></span><span>Jump (press again in the air!)</span>
      <span><kbd>SHIFT</kbd> / <kbd>X</kbd></span><span>Dash (kills slimes, dodges bullets)</span>
      <span><kbd>S</kbd>+<kbd>JUMP</kbd></span><span>Drop through thin platforms</span>
      <span><kbd>P</kbd> <kbd>R</kbd> <kbd>M</kbd></span><span>Pause / Restart / Mute</span>
    </div>
    <p class="sub">Stomp enemies. Cling to walls and jump off them. Grab coins.</p>
    <div class="btns">${lvlBtns}</div>
    <p class="sub" style="margin-top:16px">Press ENTER to start level 1</p>
  </div>`);
}

function togglePause() {
  if (G.state === 'play') {
    G.state = 'pause';
    Snd.duck(true);
    showScreen(`<div class="panel"><h2>PAUSED</h2>
      <p>Take a breather. The slimes will wait.</p>
      <div class="btns">
        <button class="pix" data-a="resume">Resume</button>
        <button class="pix alt" data-a="retry">Restart level</button>
        <button class="pix alt" data-a="menu">Quit to title</button>
      </div></div>`);
  } else if (G.state === 'pause') {
    G.state = 'play';
    Snd.duck(false);
    hideScreen();
  }
}

function toggleMute() {
  const m = Snd.toggleMute();
  $('muteBtn').textContent = m ? 'SND OFF' : 'SND ON';
}
$('muteBtn').addEventListener('click', () => { Snd.init(); toggleMute(); });
$('muteBtn').style.display = 'block';
$('muteBtn').textContent = Snd.muted ? 'SND OFF' : 'SND ON';

function handleKeys() {
  const pr = Input.pressed;
  if (pr.mute) toggleMute();
  if (pr.pause) togglePause();
  if (pr.restart && (G.state === 'play' || G.state === 'clearing')) startLevel(G.lvl);
  if (pr.confirm) {
    if (G.state === 'title') startLevel(0);
    else if (G.state === 'clear') ACTIONS[G.lvl >= LEVELS.length - 1 ? 'menu' : 'next']();
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') togglePause(); });
window.addEventListener('pointerdown', () => Snd.init(), { once: false });

/* ---------------------------------------------------------------------
   16. HUD
   --------------------------------------------------------------------- */
const hudCache = {};
function setHud(id, html) {
  if (hudCache[id] !== html) { hudCache[id] = html; $(id).innerHTML = html; }
}
function updateHud() {
  if (G.state === 'title' || G.state === 'boot') return;
  let hearts = '';
  for (let i = 0; i < P.maxHp; i++) hearts += i < P.hp ? '&#9829;' : '<span class="off">&#9829;</span>';
  setHud('hHearts', hearts);
  setHud('hCoins', '&#9679; ' + G.coins + ' / ' + Wd.coinsTotal);
  setHud('hTime', fmtTime(G.time));
  setHud('hScore', String(G.score).padStart(6, '0'));
  const dashPct = P.airDashUsed ? 0 : clamp(1 - P.dashCd / PLAYER.dashCooldown, 0, 1) * 100;
  const bar = $('hDash');
  const w = dashPct.toFixed(0) + '%';
  if (bar.style.width !== w) bar.style.width = w;
}

/* ---------------------------------------------------------------------
   17. VISUAL SYNC + CAMERA
   --------------------------------------------------------------------- */
function snapCamera() {
  const tx = P.x, ty = P.y + 1.5;
  G.camX = tx; G.camY = ty;
  clampCamera();
}
function clampCamera() {
  const minX = view.w / 2, maxX = Wd.w - view.w / 2;
  G.camX = maxX < minX ? Wd.w / 2 : clamp(G.camX, minX, maxX);
  G.camY = view.h >= LEVEL_H ? LEVEL_H / 2 : clamp(G.camY, view.h / 2 - 0.4, LEVEL_H - view.h / 2);
}

function updateCamera(dt) {
  if (G.state === 'title') {
    G.attractT += dt;
    const k = (1 - Math.cos(G.attractT * 0.06)) / 2;
    G.camX = lerp(view.w / 2, Wd.w - view.w / 2, k);
    G.camY = 7;
  } else if (!P.dead || P.deadT < 0.5) {
    const tx = P.x + P.face * 2.0, ty = P.y + 1.6;
    const kx = 1 - Math.exp(-5 * dt), ky = 1 - Math.exp(-4 * dt);
    G.camX = lerp(G.camX, tx, kx);
    G.camY = lerp(G.camY, ty, ky);
  }
  clampCamera();
  const s = FX.shake * FX.shake;
  cam.position.x = G.camX + (Math.random() - 0.5) * s * 0.9;
  cam.position.y = G.camY + (Math.random() - 0.5) * s * 0.9;
  // parallax layers follow the camera
  for (const l of bgLayerMeshes) {
    l.mesh.position.x = cam.position.x;
    l.mesh.position.y = cam.position.y;
    if (!l.sky) l.mesh.material.map.offset.x = (G.camX * l.par) / BG_TEX_W;
  }
}

function syncMeshes(dt) {
  const t = G.anim;
  const S = Art.S;

  for (const c of Wd.coins) {
    if (c.got) continue;
    const bob = Math.sin(t * 3 + c.ph) * 0.07;
    c.mesh.position.set(c.x, c.y + bob, 0.2);
    if (c.kind === 'coin') setTex(c.mesh, S.coin[Math.floor(t * 8 + c.ph) % 4]);
    else { const k = 1 + Math.sin(t * 5 + c.ph) * 0.08; c.mesh.scale.set(k, k, 1); }
  }

  for (const e of Wd.enemies) {
    if (!e.alive) continue;
    const m = e.mesh;
    if (e.kind === 'slime') {
      const sq = Math.sin(e.t * 7) * 0.07;
      m.position.set(e.x, e.y + 0.5 - sq * 0.4, 0.3);
      m.scale.set(e.dir * (1 + sq), 1 - sq, 1);
    } else if (e.kind === 'bat') {
      setTex(m, S.bat[Math.floor(e.t * 9) % 2]);
      m.position.set(e.x, e.y + 0.05, 0.3);
      m.scale.set(e.dir >= 0 ? 1 : -1, 1, 1);
    } else if (e.kind === 'saw') {
      m.position.set(e.x, e.y + 0.4, 0.3);
    } else if (e.kind === 'turret') {
      m.position.set(e.x, e.y + 0.4, 0.3);
      m.scale.set(e.dir, 1, 1);
    } else if (e.kind === 'boss') {
      let sq = 0;
      if (e.state === 'jump') sq = clamp(e.vy / 60, -0.25, 0.25) * 0.8;
      else if (e.state === 'recover') sq = -0.12 * Math.min(1, e.st * 2);
      else if (e.state === 'charge' && e.st > 0.75) sq = Math.sin(t * 60) * 0.05;
      else sq = Math.sin(t * 5) * 0.04;
      m.position.set(e.x, e.y + 1.55 - sq * 1.2, 0.3);
      m.scale.set(3.1 * (1 - sq) * (e.dir >= 0 ? 1 : -1), 3.1 * (1 + sq), 1);
      const flashing = e.inv > 0 && Math.floor(t * 20) % 2 === 0;
      m.material.color.setHex(flashing ? 0xff8888 : e.state === 'charge' && e.st > 0.75 ? 0xffb0b0 : 0xffffff);
      if (e.state === 'dying') m.visible = Math.floor(t * 30) % 2 === 0;
    }
  }

  for (const s of Wd.shots) {
    s.mesh.position.set(s.x, s.y, 0.35);
    const k = 1 + Math.sin(t * 25) * 0.12;
    s.mesh.scale.set((s.purple ? 0.7 : 0.6) * k, (s.purple ? 0.7 : 0.6) * k, 1);
  }

  for (const s of Wd.springs) {
    s.t = Math.max(0, s.t - dt);
    setTex(s.mesh, S.spring[s.t > 0 ? 1 : 0]);
    s.mesh.position.set(s.x, s.y + 0.5, 0.2);
  }

  for (const c of Wd.checks) {
    const f = Math.floor(t * 6 + c.t) % 4;
    setTex(c.cloth, c.on ? S.flagOn[f] : S.flagOff[f]);
  }

  if (Wd.goal) {
    Wd.goal.mesh.position.set(Wd.goal.x, Wd.goal.y + 1.1 + Math.sin(t * 2) * 0.05, 0.15);
    setTex(Wd.goal.mesh, S.portal[Math.floor(t * 12) % 6]);
    if (Math.random() < 0.3) FX.emit(Wd.goal.x + rndRange(-0.6, 0.6), Wd.goal.y + rndRange(0.2, 2), 1, { colors: [0x6fe7ff, 0xff5d8f, 0xffffff], speed: 0.8, angle: Math.PI / 2, life: 0.9, gravity: -1, size: 0.14 });
  }

  // player sprite
  if (P.mesh && !P.dead) {
    let frame = 'idle';
    if (P.dashT > 0) frame = 'runA';
    else if (P.wallDir && !P.onGround && P.vy < 0) frame = 'wall';
    else if (!P.onGround) frame = P.vy > 0 ? 'jump' : 'fall';
    else if (Math.abs(P.vx) > 0.8) {
      P.runT += dt * (6 + Math.abs(P.vx));
      frame = Math.floor(P.runT / 3) % 2 ? 'runA' : 'runB';
      if (Math.random() < 0.08) FX.emit(P.x - P.face * 0.2, P.y + 0.05, 1, { colors: [0xffffff, 0xcfc4ee], speed: 1, angle: Math.PI / 2, life: 0.3, gravity: 1, size: 0.12 });
    }
    setTex(P.mesh, S.hero[frame]);
    P.sx = lerp(P.sx, 1, 1 - Math.exp(-14 * dt));
    P.sy = lerp(P.sy, 1, 1 - Math.exp(-14 * dt));
    const bob = frame === 'idle' ? Math.sin(t * 3) * 0.015 : 0;
    const dashStretch = P.dashT > 0 ? 1.25 : 1;
    const wallFace = frame === 'wall' ? -P.wallDir : P.face;
    P.mesh.scale.set(P.sx * dashStretch * (wallFace >= 0 ? 1 : -1), P.sy * (P.dashT > 0 ? 0.85 : 1), 1);
    P.mesh.position.set(P.x, P.y + 0.44 + bob + (P.sy - 1) * 0.5, 0.5);
    P.mesh.visible = P.inv > 0 ? Math.floor(t * 14) % 2 === 0 : true;
    if (P.inv > 1.2 && P.hp > 0) P.mesh.visible = Math.floor(t * 14) % 2 === 0;
  }
}

/* ---------------------------------------------------------------------
   18. MAIN LOOP
   --------------------------------------------------------------------- */
function step(dt) {
  if (G.freeze > 0) { G.freeze -= dt; return; }
  if (G.state === 'title') {
    updatePlatforms(dt); updateEnemies(dt); updateShots(dt);
    return;
  }
  if (G.state === 'clearing') {
    G.clearT -= dt;
    updatePlatforms(dt); updateEnemies(dt); updateShots(dt);
    if (G.clearT <= 0) showClear();
    return;
  }
  G.time += dt;
  updatePlatforms(dt);
  if (!P.dead) updatePlayer(dt);
  else { P.deadT += dt; if (P.deadT > 1.4) respawn(); }
  updateEnemies(dt);
  updateShots(dt);
  updateInteractions(dt);
}

let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  Input.update();
  handleKeys();
  const running = G.state === 'play' || G.state === 'clearing' || G.state === 'title';
  if (running) {
    acc += rdt;
    let n = 0;
    while (acc >= PHYS_DT && n < 12) { step(PHYS_DT); acc -= PHYS_DT; n++; }
    if (n >= 12) acc = 0;
    G.anim += rdt;
    FX.update(rdt);
    syncMeshes(rdt);
  }
  updateCamera(running ? rdt : 0);
  updateHud();
  renderer.render(scene, cam);
  Input.endFrame();
}

/* ---------------------------------------------------------------------
   19. BOOT
   --------------------------------------------------------------------- */
(function boot() {
  const errs = validateChunks();
  Art.build();
  resize();
  showTitle();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  window.__slop = { G, P, Wd, LEVELS, loadLevel, startLevel, errs, CHUNKS, step, Input, tileAt, isSolid };
})();
</script>
