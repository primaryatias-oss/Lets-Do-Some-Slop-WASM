<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slop Runner - WASM Edition</title>
<meta name="description" content="Slop Runner WASM Edition: a 2D platformer whose whole simulation runs in WebAssembly compiled from C, Rust, Zig, Go, Nim, OCaml, Haskell or F*, rendered with Three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1030;
    --panel: rgba(20, 10, 44, 0.86);
    --accent: #ffd23f;
    --accent2: #ff5d8f;
    --good: #5be37d;
    --text: #fff6e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0616; color: var(--text);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas#c { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }
  #scan {
    position: absolute; inset: 0; pointer-events: none; opacity: .10;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.6) 3px);
  }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: none; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; font-size: 12px;
    text-shadow: 2px 2px 0 #000;
  }
  #hud .box { background: rgba(10,5,25,.55); border: 2px solid rgba(255,255,255,.25); padding: 8px 10px; }
  #hud .hearts { font-size: 18px; letter-spacing: 3px; color: var(--accent2); }
  #hud .hearts .off { color: #4a3b62; }
  #hud .coins { color: var(--accent); }
  #hud .mid { text-align: center; }
  #hud .lvl { font-size: 9px; opacity: .8; margin-bottom: 6px; }
  #hud .right { text-align: right; }
  #hud .dash { margin-top: 6px; font-size: 8px; }
  #hud .dash i { display: inline-block; width: 46px; height: 6px; background: #3b2d5c; vertical-align: middle; margin-left: 6px; }
  #hud .dash i b { display: block; height: 100%; width: 100%; background: #6fe7ff; }
  #bossbar {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: min(60vw, 520px); display: none; text-align: center; font-size: 10px;
    text-shadow: 2px 2px 0 #000;
  }
  #bossbar .bar { margin-top: 6px; height: 14px; border: 3px solid #fff; background: #2a1140; }
  #bossbar .bar b { display: block; height: 100%; background: linear-gradient(#ff7a7a, #c0143c); width: 100%; transition: width .2s; }

  /* ---------- Screens ---------- */
  #screen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 3, 20, .55); padding: 16px; z-index: 5;
  }
  #screen.hidden { display: none; }
  .panel {
    background: var(--panel); border: 4px solid #fff; box-shadow: 8px 8px 0 rgba(0,0,0,.55);
    padding: 26px 30px; text-align: center; max-width: 640px; width: 100%;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h1 {
    margin: 0 0 6px; font-size: clamp(22px, 5vw, 44px); line-height: 1.2; color: var(--accent);
    text-shadow: 4px 4px 0 var(--accent2), 8px 8px 0 #000;
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
  .panel h2 { margin: 0 0 14px; font-size: clamp(16px, 3.4vw, 26px); color: var(--accent); text-shadow: 3px 3px 0 #000; }
  .panel p { font-size: 10px; line-height: 1.9; margin: 10px 0; color: #e9dcff; }
  .panel .sub { font-size: 9px; color: #b59ae0; margin-bottom: 18px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  button.pix {
    font-family: inherit; font-size: 11px; color: var(--ink); background: var(--accent);
    border: 3px solid #fff; padding: 12px 14px; cursor: pointer; box-shadow: 4px 4px 0 #000;
    text-transform: uppercase;
  }
  button.pix:hover, button.pix:focus { background: #fff; outline: none; transform: translate(-1px,-1px); }
  button.pix:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #000; }
  button.pix.alt { background: #6fe7ff; }
  button.pix[disabled] { opacity: .35; cursor: not-allowed; filter: grayscale(1); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; line-height: 1.6; text-align: left; font-size: 9px; margin: 14px auto 4px; max-width: 420px; }
  .keys kbd {
    background: #3a2a63; border: 2px solid #8c73c9; padding: 3px 6px; margin-right: 3px; font-family: inherit;
    box-shadow: 0 2px 0 #000;
  }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; font-size: 11px; text-align: left; margin: 14px 0; }
  .stats span:nth-child(even) { text-align: right; color: var(--accent); }
  .rank { font-size: 40px; color: var(--accent2); text-shadow: 3px 3px 0 #000; margin: 6px 0; }

  /* ---------- Popups ---------- */
  #popups { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; font-size: 10px; text-shadow: 2px 2px 0 #000; transform: translate(-50%, -50%); white-space: nowrap; }

  /* ---------- Touch controls ---------- */
  #touch { position: absolute; inset: auto 0 0 0; height: 45%; display: none; pointer-events: none; z-index: 4; }
  #touch .pad { position: absolute; bottom: 18px; display: flex; gap: 12px; pointer-events: auto; }
  #touch .l { left: 16px; } #touch .r { right: 16px; }
  #touch .tb {
    width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.18); color: #fff; font-family: inherit; font-size: 14px;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
  }
  #touch .tb.on { background: rgba(255,210,63,.55); }
  #corner { position: absolute; right: 12px; bottom: 10px; font-size: 8px; opacity: .55; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #muteBtn {
    position: absolute; right: 12px; top: 64px; z-index: 6; font-size: 8px; padding: 6px 8px; display: none;
  }

  .pick { margin: 14px auto 6px; max-width: 460px; text-align: left; border: 3px dashed #8c73c9; padding: 10px 12px; background: rgba(60,40,110,.35); }
  .pick label { display: block; font-size: 8px; color: #b59ae0; margin-bottom: 8px; letter-spacing: 1px; }
  .pick select {
    width: 100%; font-family: inherit; font-size: 11px; padding: 10px 8px; color: var(--ink); background: var(--accent);
    border: 3px solid #fff; box-shadow: 4px 4px 0 #000; cursor: pointer; text-transform: uppercase;
  }
  .pick .info { font-size: 8px; line-height: 1.8; margin-top: 10px; color: #e9dcff; min-height: 30px; }
  .pick .info b { color: var(--accent); }
  .pick .info.err { color: #ff8b9f; }
  #core-badge { position: absolute; left: 12px; bottom: 10px; font-size: 8px; opacity: .8; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #fatal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 20; background: #200; font-size: 12px; line-height: 2; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="scan"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="popups"></div>
  <div id="hud">
    <div class="box"><div class="hearts" id="hHearts"></div><div class="coins" id="hCoins"></div></div>
    <div class="box mid"><div class="lvl" id="hLevel"></div><div id="hTime">0:00.0</div></div>
    <div class="box right"><div id="hScore">0</div><div class="dash">DASH<i><b id="hDash"></b></i></div></div>
  </div>
  <div id="bossbar"><div>THE GREAT BLOB</div><div class="bar"><b id="bossFill"></b></div></div>
  <div id="touch">
    <div class="pad l"><div class="tb" data-k="left">&#9664;</div><div class="tb" data-k="right">&#9654;</div></div>
    <div class="pad r"><div class="tb" data-k="dash">DASH</div><div class="tb" data-k="jump">JUMP</div></div>
  </div>
  <button class="pix alt" id="muteBtn">SND ON</button>
  <div id="screen"></div>
  <div id="corner">SLOP RUNNER v2.0 - three.js + WASM</div>
  <div id="core-badge"></div>
  <div id="fatal"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="abi.js"></script>
<script src="core.js"></script>
<script src="backends.js"></script>
<script>
'use strict';
/* =====================================================================
   SLOP RUNNER
   A 2D platformer proof of concept: one HTML file, rendered by Three.js.
   All art is procedural (canvas-drawn pixel sprites), all audio is
   synthesized with WebAudio, all levels are stitched from ASCII chunks.
   ===================================================================== */

if (typeof THREE === 'undefined') {
  const f = document.getElementById('fatal');
  f.style.display = 'flex';
  f.textContent = 'Could not load three.js from the CDN. Check your connection and reload.';
  throw new Error('three.js missing');
}

/* ---------------------------------------------------------------------
   0b. NO ZOOM  (pinch, double-tap, ctrl+wheel, ctrl +/-)
   --------------------------------------------------------------------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].includes(e.key)) e.preventDefault(); });

/* ---------------------------------------------------------------------
   0. UTILS
   --------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fmtTime(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('slop.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('slop.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

/* ---------------------------------------------------------------------
   1. TUNING
   --------------------------------------------------------------------- */
const LEVEL_H = 14;            // tiles tall, every level
const VIEW_H = 13;             // tiles visible vertically (wide screens)
const PHYS_DT = 1 / 120;       // fixed physics step

const PLAYER = {
  w: 0.62, h: 0.86,
  maxSpeed: 8.2, accelGround: 95, accelAir: 62, decelGround: 110, decelAir: 26,
  gravity: 62, fallGravity: 74, maxFall: 27,
  jumpV: 19.6, doubleV: 17.2, cutMul: 0.45,
  coyote: 0.11, buffer: 0.13,
  wallSlide: 3.4, wallJumpX: 9.5, wallJumpY: 18.2, wallLock: 0.16,
  dashTime: 0.17, dashSpeed: 24, dashCooldown: 0.75,
  invuln: 1.5, stompBounce: 15.5,
};

/* ---------------------------------------------------------------------
   2. AUDIO  (all synthesized, no assets)
   --------------------------------------------------------------------- */
const Snd = (() => {
  let ctx = null, master = null, musicBus = null;
  let muted = store.get('muted', false);
  let musicOn = false, step = 0, nextTime = 0, timer = null, theme = null;

  const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(ctx.destination);
    musicBus = ctx.createGain();
    musicBus.gain.value = 0.32;
    musicBus.connect(master);
  }

  function tone(freq, dur, type = 'square', vol = 0.15, slideTo = null, delay = 0, bus = null) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(bus || master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noise(dur, vol = 0.2, freq = 1800, delay = 0) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }

  const sfx = {
    jump()    { tone(320, 0.16, 'square', 0.12, 760); },
    double()  { tone(520, 0.16, 'square', 0.11, 1100); },
    wall()    { tone(260, 0.12, 'triangle', 0.16, 700); },
    land()    { noise(0.08, 0.12, 700); },
    coin()    { tone(988, 0.07, 'square', 0.1); tone(1319, 0.16, 'square', 0.1, null, 0.06); },
    gem()     { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.14, 'square', 0.1, null, i * 0.06)); },
    heart()   { [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', 0.18, null, i * 0.07)); },
    stomp()   { tone(220, 0.14, 'square', 0.16, 70); noise(0.1, 0.15, 1400); },
    hurt()    { tone(300, 0.35, 'sawtooth', 0.18, 60); noise(0.2, 0.2, 900); },
    die()     { tone(440, 0.7, 'sawtooth', 0.2, 40); noise(0.5, 0.25, 500); },
    dash()    { noise(0.16, 0.18, 4200); tone(200, 0.15, 'sawtooth', 0.06, 900); },
    spring()  { tone(180, 0.3, 'sine', 0.3, 900); },
    shoot()   { tone(700, 0.14, 'square', 0.07, 200); },
    check()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.16, null, i * 0.08)); },
    crumble() { noise(0.25, 0.15, 500); },
    boom()    { noise(0.7, 0.35, 380); tone(120, 0.6, 'sine', 0.3, 30); },
    bossHit() { tone(150, 0.25, 'square', 0.2, 60); noise(0.2, 0.2, 700); },
    win()     { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'square', 0.13, null, i * 0.11)); },
    click()   { tone(660, 0.05, 'square', 0.08); },
    door()    { noise(0.4, 0.25, 300); tone(70, 0.4, 'sawtooth', 0.15, 40); },
  };

  // --- tiny generative music: bass + arpeggio + hat ---
  const THEMES = [
    { root: 57, scale: [0, 2, 4, 7, 9], tempo: 132, lead: 'square',   bass: 'triangle' },
    { root: 52, scale: [0, 3, 5, 7, 10], tempo: 104, lead: 'triangle', bass: 'sine' },
    { root: 55, scale: [0, 2, 3, 7, 8],  tempo: 146, lead: 'sawtooth', bass: 'square' },
  ];
  const BASS_PAT = [0, 0, 7, 0, 5, 5, 3, 7];
  const ARP_PAT = [0, 2, 4, 2, 3, 1, 4, 2, 0, 3, 1, 4, 2, 3, 1, 0];

  function scheduleStep(t, s) {
    const th = THEMES[theme % THEMES.length];
    const stepDur = 60 / th.tempo / 2;
    const bar = Math.floor(s / 8) % 4;
    const bassNote = th.root - 24 + BASS_PAT[s % 8] * (bar === 3 ? 0.5 : 1);
    const bt = t - ctx.currentTime;
    if (s % 2 === 0) tone(NOTE(Math.round(bassNote)), stepDur * 1.8, th.bass, 0.32, null, bt, musicBus);
    const sc = th.scale;
    const idx = ARP_PAT[(s + bar * 3) % ARP_PAT.length];
    const oct = 12 * (1 + ((s >> 3) & 1));
    tone(NOTE(th.root + sc[idx] + oct), stepDur * 0.9, th.lead, 0.13, null, bt, musicBus);
    if (s % 4 === 2) {
      // closed hat
      const len = Math.floor(ctx.sampleRate * 0.03);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const g = ctx.createGain(); g.gain.value = 0.16;
      src.connect(g); g.connect(musicBus); src.start(t);
    }
    return stepDur;
  }

  function pump() {
    if (!ctx || !musicOn) return;
    while (nextTime < ctx.currentTime + 0.25) {
      if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.02;
      nextTime += scheduleStep(nextTime, step++);
    }
  }

  return {
    init,
    sfx,
    play(name) { if (!muted && ctx && sfx[name]) sfx[name](); },
    startMusic(t) {
      if (!ctx) return;
      theme = t; step = 0; nextTime = ctx.currentTime + 0.05;
      musicOn = true;
      clearInterval(timer);
      timer = setInterval(pump, 60);
    },
    stopMusic() { musicOn = false; clearInterval(timer); },
    toggleMute() {
      muted = !muted; store.set('muted', muted);
      if (master) master.gain.value = muted ? 0 : 0.55;
      return muted;
    },
    get muted() { return muted; },
    duck(on) { if (musicBus) musicBus.gain.setTargetAtTime(on ? 0.1 : 0.32, ctx.currentTime, 0.1); },
  };
})();

/* ---------------------------------------------------------------------
   3. INPUT  (keyboard, touch, gamepad)
   --------------------------------------------------------------------- */
const Input = (() => {
  const held = { left: false, right: false, jump: false, dash: false, down: false };
  const pressed = { left: false, right: false, jump: false, dash: false, down: false, pause: false, restart: false, mute: false, confirm: false };
  const map = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyC: 'jump',
    ShiftLeft: 'dash', ShiftRight: 'dash', KeyX: 'dash', KeyK: 'dash',
    ArrowDown: 'down', KeyS: 'down',
  };
  const touchHeld = {};
  let padHeld = {}, padPrev = {};

  const keyHeld = {};
  function set(k, v) {
    if (v && !held[k]) pressed[k] = true;
    held[k] = v;
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    Snd.init();
    if (e.repeat) return;
    const k = map[e.code];
    if (k) keyHeld[k] = true;
    if (e.code === 'Escape' || e.code === 'KeyP') pressed.pause = true;
    if (e.code === 'KeyR') pressed.restart = true;
    if (e.code === 'KeyM') pressed.mute = true;
    if (e.code === 'Enter' || e.code === 'Space') pressed.confirm = true;
  });
  window.addEventListener('keyup', (e) => {
    const k = map[e.code];
    if (k) keyHeld[k] = false;
  });
  window.addEventListener('blur', () => { for (const k in keyHeld) keyHeld[k] = false; });

  // touch buttons
  document.querySelectorAll('#touch .tb').forEach((el) => {
    const k = el.dataset.k;
    const on = (e) => { e.preventDefault(); Snd.init(); touchHeld[k] = true; el.classList.add('on'); };
    const off = (e) => { e.preventDefault(); touchHeld[k] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  });

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    padPrev = padHeld; padHeld = {};
    for (const p of pads) {
      if (!p) continue;
      const ax = p.axes[0] || 0;
      if (ax < -0.4 || (p.buttons[14] && p.buttons[14].pressed)) padHeld.left = true;
      if (ax > 0.4 || (p.buttons[15] && p.buttons[15].pressed)) padHeld.right = true;
      if ((p.axes[1] || 0) > 0.6 || (p.buttons[13] && p.buttons[13].pressed)) padHeld.down = true;
      if (p.buttons[0] && p.buttons[0].pressed) padHeld.jump = true;
      if ((p.buttons[1] && p.buttons[1].pressed) || (p.buttons[2] && p.buttons[2].pressed) || (p.buttons[5] && p.buttons[5].pressed)) padHeld.dash = true;

    }
    if (padHeld.pause && !padPrev.pause) pressed.pause = true;

  }

  return {
    held, pressed,
    update() {
      pollPad();
      for (const k of ['left', 'right', 'jump', 'dash', 'down']) {
        const v = !!(keyHeld[k] || touchHeld[k] || padHeld[k]);
        set(k, v);
      }
    },
    endFrame() { for (const k in pressed) pressed[k] = false; },
    get axis() { return (held.right ? 1 : 0) - (held.left ? 1 : 0); },
  };
})();

    g.fillStyle = color;
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 2) {
      let y = base;
      for (const [k, a, ph] of waves) y += Math.sin(x / W * TAU * k + ph) * a;
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
  }

          const x = i * 26 + rnd() * 10, w = 10 + rnd() * 12, h = 30 + rnd() * 60;
          g.fillStyle = '#20143f';
          g.beginPath(); g.moveTo(x - w, 0); g.lineTo(x + w, 0); g.lineTo(x, h); g.closePath(); g.fill();
        }
      }, 0.12);
      mk((g) => {
        ridge(g, W, H, 180, [[2, 24], [6, 12]], '#2a1a55', 4);
        for (let i = 0; i < 24; i++) {
          g.fillStyle = 'rgba(95,240,255,' + (0.25 + rnd() * 0.5) + ')';
          g.fillRect(rnd() * W, 60 + rnd() * 150, 2, 2);
        }
      }, 0.22);
      mk((g) => { // glowing crystals
        ridge(g, W, H, 215, [[3, 10], [8, 4]], '#1c1040', 5);
        for (let i = 0; i < 14; i++) {
          const x = i * 36 + rnd() * 20, h = 18 + rnd() * 34, col = rnd() < 0.5 ? '#5ff0ff' : '#ff8bd7';
          g.fillStyle = col; g.globalAlpha = 0.55;
          g.beginPath(); g.moveTo(x - 6, 256); g.lineTo(x, 256 - h - 10); g.lineTo(x + 6, 256); g.closePath(); g.fill();
          g.globalAlpha = 1;
        }
      }, 0.42);
    } else {
      mk((g) => { // stars + moon
        for (let i = 0; i < 90; i++) {
          g.fillStyle = 'rgba(255,255,255,' + (0.3 + rnd() * 0.7) + ')';
          g.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * 170), rnd() < 0.15 ? 2 : 1, rnd() < 0.15 ? 2 : 1);
        }
        g.fillStyle = '#ffe9f6'; g.beginPath(); g.arc(120, 66, 26, 0, TAU); g.fill();
        g.fillStyle = '#1a1050'; g.beginPath(); g.arc(132, 60, 22, 0, TAU); g.fill();
      }, 0.04);
      const skyline = (g, base, wMin, wMax, hMin, hMax, col, winCol, wrapSafe) => {
        let x = 0;
        while (x < W) {
          const w = Math.min(wMin + Math.floor(rnd() * (wMax - wMin)), W - x);
          const h = hMin + rnd() * (hMax - hMin);
          g.fillStyle = col; g.fillRect(x, base - h, w, h + 256);
          g.fillStyle = winCol;
          for (let wy = base - h + 6; wy < base - 4; wy += 8) {
            for (let wx = x + 4; wx < x + w - 4; wx += 6) {
              if (rnd() < 0.45) g.fillRect(wx, wy, 3, 4);
            }
          }
          if (rnd() < 0.3) { g.fillStyle = '#ff4d8d'; g.fillRect(x + w / 2, base - h - 10, 1, 10); }
          x += w + Math.floor(rnd() * 4);
        }
      };
      mk((g) => skyline(g, 200, 22, 40, 40, 110, '#1a1350', 'rgba(255,225,79,.55)'), 0.16);
      mk((g) => skyline(g, 240, 28, 50, 30, 100, '#0e0a30', 'rgba(111,231,255,.7)'), 0.34);
    }
    return layers;
  }

  /* ---------- build every texture we need ---------- */
  const S = {};
  function build() {
    const heroFrame = (legs) => sprite(HERO_BODY.concat(HERO_LEGS[legs]), HERO_PAL);

    S.flagOff = [0, 1, 2, 3].map((f) => makeTex(flagCloth(false, f)));
    S.flagOn = [0, 1, 2, 3].map((f) => makeTex(flagCloth(true, f)));
    S.saw = makeTex(saw());
    S.orbRed = makeTex(orb('#ff7a3d', '#8a1500'));
    S.orbPurple = makeTex(orb('#e58bff', '#5b1a8a'));
    S.portal = [0, 1, 2, 3, 4, 5].map((f) => makeTex(portalFrame(f)));
    S.atlas = [0, 1, 2].map((t) => makeTex(tileAtlas(t)));
    S.shadow = (() => {
      const c = canvas(32, 16), g = c.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(16, 8, 14, 5, 0, 0, TAU); g.fill();

    })();
    S.white = (() => {
      const c = canvas(2, 2), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 2, 2); return makeTex(c);
    })();

  return { S, T, THEME_DEF, build, bgLayers, makeTex };
})();

const ARENA_W = 32;

const LEVELS = [
  { name: 'Meadow Daze',       sub: 'Chill vibes. Mind the slime.', theme: 0, seed: 7,   count: 9,  tiers: [[1], [1], [1, 2], [1, 2], [2]] },

function validateChunks() {
  const errs = [];
  for (const c of CHUNKS.concat(Object.entries(SPECIAL).map(([id, v]) => ({ id, ...v })))) {
    if (c.floor.length !== c.w) errs.push(c.id + ': floor width ' + c.floor.length + ' != ' + c.w);
    c.rows.forEach((r, i) => { if (r.length !== c.w) errs.push(c.id + ': row ' + i + ' width ' + r.length + ' != ' + c.w); });
    if (c.rows.length > 12) errs.push(c.id + ': too many rows');
  }
  if (errs.length) console.error('Chunk errors:\n' + errs.join('\n'));
  return errs;
}

// Tile ids
const TILE = { EMPTY: 0, SOLID: 1, ONEWAY: 2, SPIKE: 3 };

function buildLevel(index) {
  const def = LEVELS[index];
  const rnd = mulberry32(def.seed);
  const seq = [];  // {chunk, x0}
  let x = 0;
  const place = (chunk) => { seq.push({ chunk, x0: x }); x += chunk.w; };

  place(SPECIAL.intro);
  let last = null;
  for (let i = 0; i < def.count; i++) {
    const stage = Math.min(def.tiers.length - 1, Math.floor((i / def.count) * def.tiers.length));
    const allowed = def.tiers[stage];
    const pool = CHUNKS.filter((c) => allowed.includes(c.tier) && c !== last);
    const pick = pool[Math.floor(rnd() * pool.length)];
    place(pick); last = pick;
    if ((i + 1) % 3 === 0 && i < def.count - 1) place(SPECIAL.rest);
  }
  place(SPECIAL.rest);
  let arenaX0 = -1;
  if (def.boss) { arenaX0 = x; x += ARENA_W; } else place(SPECIAL.goal);

  const W = x;
  const tiles = new Uint8Array(W * LEVEL_H);
  const specs = [];
  const at = (tx, ty) => tiles[ty * W + tx];
  const set = (tx, ty, v) => { tiles[ty * W + tx] = v; };
  let spawn = { x: 3, y: 2 };
  const checkpoints = [];
  let goal = null, bossSpec = null;
  let door = null;

  for (const { chunk, x0 } of seq) {
    for (let c = 0; c < chunk.w; c++) {
      if (chunk.floor[c] === '#') { set(x0 + c, 0, 1); set(x0 + c, 1, 1); }
    }
    const pad = 12 - chunk.rows.length;
    chunk.rows.forEach((row, ri) => {
      const ty = 13 - (pad + ri);
      for (let c = 0; c < chunk.w; c++) {
        const ch = row[c], tx = x0 + c;
        if (ch === '.') continue;
        if (ch === '#') set(tx, ty, 1);
        else if (ch === '=') set(tx, ty, 2);
        else if (ch === '^') set(tx, ty, 3);
        else if (ch === 'P') spawn = { x: tx + 0.5, y: ty };
        else if (ch === 'K') { checkpoints.push({ x: tx + 0.5, y: ty }); specs.push({ t: 'K', tx, ty }); }
        else if (ch === 'G') { goal = { x: tx + 0.5, y: ty }; }
        else specs.push({ t: ch, tx, ty });
      }
    });
  }

  if (def.boss) {
    const x0 = arenaX0;
    for (let c = 0; c < ARENA_W; c++) { set(x0 + c, 0, 1); set(x0 + c, 1, 1); }
    for (let ty = 2; ty < LEVEL_H; ty++) set(x0 + ARENA_W - 1, ty, 1);
    for (let ty = 2; ty < LEVEL_H; ty++) set(x0 + ARENA_W - 2, ty, 1);
    for (const [a, b] of [[7, 11], [20, 24]]) for (let c = a; c <= b; c++) set(x0 + c, 5, 2);
    for (const [a, b] of [[13, 18]]) for (let c = a; c <= b; c++) set(x0 + c, 8, 2);
    specs.push({ t: 'c', tx: x0 + 9, ty: 6 }, { t: 'c', tx: x0 + 22, ty: 6 }, { t: 'H', tx: x0 + 15, ty: 9 });
    door = { x: x0 + 1, y0: 2, y1: LEVEL_H - 1 };
    bossSpec = { x: x0 + 22, y: 2, x0, trigger: x0 + 5 };
  }

  // wall the ends of the world
  return { def, index, w: W, tiles, specs, spawn, checkpoints, goal, door, bossSpec, arenaX0 };
}

function makeSprite(tex, w = 1, h = 1, z = 0, parent = worldGroup) {

const slotCache = new Map();
function slotTex(theme, slot) {
  const key = theme + ':' + slot;
  if (!slotCache.has(key)) {
    const t = Art.S.atlas[theme].clone();
    t.repeat.set(1 / 12, 1);
    t.offset.set(slot / 12, 0);
    t.needsUpdate = true;
    slotCache.set(key, t);

}

let bgLayerMeshes = [];

  cam.left = -view.w / 2; cam.right = view.w / 2; cam.top = view.h / 2; cam.bottom = -view.h / 2;

/* ---------------------------------------------------------------------
   8. PARTICLES + POPUPS + SCREEN FX
   --------------------------------------------------------------------- */
const FX = (() => {
  const POOL = 320;
  const parts = [];
  const free = [];
  const group = new THREE.Group();
  scene.add(group);
  for (let i = 0; i < POOL; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false });
    const m = new THREE.Mesh(planeGeo, mat);
    m.visible = false; m.position.z = 3;
    group.add(m);
    free.push({ m, life: 0, max: 1, vx: 0, vy: 0, g: 0, size: 0.1, spin: 0, active: false, drag: 0, shrink: true });
  }
  const popups = [];
  const flashEl = $('flash');
  let flash = 0, shake = 0;

  return {
    shake: 0,
    emit(x, y, n, o = {}) {
      const colors = o.colors || [o.color || 0xffffff];
      for (let i = 0; i < n; i++) {
        const p = free.pop();
        if (!p) return;
        const a = (o.angle !== undefined ? o.angle : rndRange(0, TAU)) + rndRange(-(o.spread || 0), o.spread || 0);
        const sp = rndRange(o.speedMin !== undefined ? o.speedMin : 1, o.speed || 4);
        p.vx = Math.cos(a) * sp + (o.vx || 0);
        p.vy = Math.sin(a) * sp + (o.vy || 0);
        p.g = o.gravity !== undefined ? o.gravity : 14;
        p.drag = o.drag || 0;
        p.max = p.life = rndRange(o.lifeMin || 0.25, o.life || 0.6);
        p.size = rndRange(o.sizeMin || 0.08, o.size || 0.18);
        p.spin = rndRange(-6, 6);
        p.shrink = o.shrink !== false;
        p.m.position.set(x + rndRange(-(o.jx || 0), o.jx || 0), y + rndRange(-(o.jy || 0), o.jy || 0), 3 + (o.z || 0));
        p.m.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
        p.m.rotation.z = rndRange(0, TAU);
        p.m.visible = true;
        p.active = true;
        parts.push(p);
      }
    },
    update(dt) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        if (p.life <= 0) {
          p.m.visible = false; p.active = false;
          parts.splice(i, 1); free.push(p);
          continue;
        }
        p.vy -= p.g * dt;
        if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
        p.m.position.x += p.vx * dt;
        p.m.position.y += p.vy * dt;
        p.m.rotation.z += p.spin * dt;
        const k = p.life / p.max;
        const s = p.size * (p.shrink ? (0.3 + 0.7 * k) : 1);
        p.m.scale.set(s, s, 1);
        p.m.material.opacity = Math.min(1, k * 2.2);
      }
      // popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.t += dt; p.y += dt * 1.4;
        if (p.t > p.life) { p.el.remove(); popups.splice(i, 1); continue; }
        const sx = (p.x - cam.position.x) / view.w * window.innerWidth + window.innerWidth / 2;
        const sy = window.innerHeight / 2 - (p.y - cam.position.y) / view.h * window.innerHeight;
        p.el.style.left = sx + 'px'; p.el.style.top = sy + 'px';
        p.el.style.opacity = Math.min(1, (p.life - p.t) * 3);
      }
      this.shake = Math.max(0, this.shake - dt * 2.8);
      if (flash > 0) { flash = Math.max(0, flash - dt * 3.5); flashEl.style.opacity = flash * 0.6; }
    },
    popup(x, y, text, color = '#ffd23f') {
      const el = document.createElement('div');
      el.className = 'pop'; el.textContent = text; el.style.color = color;
      $('popups').appendChild(el);
      popups.push({ el, x, y, t: 0, life: 0.9 });
    },
    flash(v = 1) { flash = v; flashEl.style.opacity = v * 0.6; },
    clear() {
      while (parts.length) { const p = parts.pop(); p.m.visible = false; free.push(p); }
      while (popups.length) popups.pop().el.remove();
    },
  };
})();
function rndRange(a, b) { return a + Math.random() * (b - a); }

/* ---------------------------------------------------------------------
   9. LEVEL MESH  (all tiles merged into one draw call)
   --------------------------------------------------------------------- */
function buildLevelMesh(L) {
  const pos = [], uvs = [], idx = [];
  const rnd = mulberry32(L.def.seed * 7 + 1);
  let vi = 0;
  const N = 12, inset = 0.02 / (16 * N);
  const quad = (x, y, slot, z) => {
    pos.push(x, y, z, x + 1, y, z, x + 1, y + 1, z, x, y + 1, z);
    const u0 = slot / N + inset, u1 = (slot + 1) / N - inset;
    uvs.push(u0, 0, u1, 0, u1, 1, u0, 1);
    idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
    vi += 4;
  };
  const T = Art.T;
  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = 0; tx < L.w; tx++) {
      const t = L.tiles[ty * L.w + tx];
      if (t === 0) continue;
      if (t === 1) {
        const above = ty + 1 < LEVEL_H ? L.tiles[(ty + 1) * L.w + tx] : 0;
        const exposed = above !== 1;
        quad(tx, ty, exposed ? T.TOP : T.FILL, 0);
        if (exposed && ty >= 1 && above === 0 && rnd() < 0.2) quad(tx, ty + 1, T.D1 + Math.floor(rnd() * 3), -0.1);
      } else if (t === 2) quad(tx, ty, T.ONEWAY, 0.05);
      else if (t === 3) quad(tx, ty, T.SPIKE, 0.05);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const mat = new THREE.MeshBasicMaterial({ map: Art.S.atlas[L.def.theme], transparent: true, alphaTest: 0.5, depthWrite: false });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  worldGroup.add(mesh);
  return mesh;
}



/* ---------------------------------------------------------------------
   10. SIM FACADE  -  the whole simulation lives in a WASM core.
   The core owns ONE flat Float64 array (layout: tools/abi.py).  The host
   writes input + level data into it, calls advance(dt), then reads state
   and an event queue back out.  Everything below is rendering glue.
   --------------------------------------------------------------------- */
let simBe = null;     // active backend {id, name, get, set, init, loadLevel, advance, view}
let simM = null;      // Float64Array view of the core memory (or null -> use get/set calls)
const rd = (i) => (simM ? simM[i] : simBe.get(i));
const wr = (i, v) => { if (simM) simM[i] = v; else simBe.set(i, v); };

const simStat = { ms: 0, steps: 0, frames: 0, avg: 0 };

const SPEC_KIND = { c: SK_COIN, g: SK_GEM, H: SK_HEART, E: SK_SLIME, F: SK_BAT, W: SK_SAW, T: SK_TURRET, J: SK_SPRING, m: SK_PLAT_H, n: SK_PLAT_V, x: SK_CRUMBLE, K: SK_CHECK };

function simLoad(L, attract) {
  simBe.init();
  simM = simBe.view();
  wr(G_LW, L.w);
  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = 0; tx < L.w; tx++) {
      const v = L.tiles[ty * L.w + tx];
      if (v) wr(TILE_BASE + ty * L.w + tx, v);
    }
  }
  let n = 0;
  const put = (k, x, y) => { wr(SPEC_BASE + n * SPEC_N, k); wr(SPEC_BASE + n * SPEC_N + 1, x); wr(SPEC_BASE + n * SPEC_N + 2, y); n++; };
  for (const s of L.specs) if (SPEC_KIND[s.t] !== undefined) put(SPEC_KIND[s.t], s.tx + 0.5, s.ty);
  if (L.bossSpec) {
    put(SK_BOSS, L.bossSpec.x, L.bossSpec.y);
    wr(G_BSPECX, L.bossSpec.x); wr(G_BSPECY, L.bossSpec.y); wr(G_BTRIG, L.bossSpec.trigger);
  }
  wr(G_NSPEC, n);
  if (L.door) { wr(G_DOORON, 1); wr(G_DOORX, L.door.x); wr(G_DOORY0, L.door.y0); wr(G_DOORY1, L.door.y1); }
  if (L.goal) { wr(G_GOALON, 1); wr(G_GOALX, L.goal.x); wr(G_GOALY, L.goal.y); }
  wr(G_SPAWNX, L.spawn.x); wr(G_SPAWNY, L.spawn.y);
  wr(G_VIEWW, view.w);
  wr(G_RNG, (L.def.seed * 97 + 13) % 4294967296);
  wr(G_MODE, attract ? MODE_TITLE : MODE_PLAY);
  simBe.loadLevel();
  simM = simBe.view();
  if (attract) wr(P_DEAD, 1);
}

/* ---------- visual mirrors of the core's entity tables ---------- */
const Wd = { L: null, w: 0, coins: [], enemies: [], plats: [], shots: [], springs: [], checks: [], goal: null, doors: [] };

function clearWorld() {
  worldGroup.traverse((o) => { if (o.material && o.material.dispose) o.material.dispose(); if (o.geometry && o.geometry !== planeGeo) o.geometry.dispose(); });
  while (worldGroup.children.length) worldGroup.remove(worldGroup.children[0]);
  Object.assign(Wd, { coins: [], enemies: [], plats: [], shots: [], springs: [], checks: [], goal: null, doors: [] });
}

function buildEntities(L) {
  const S = Art.S, T = Art.T, theme = L.def.theme;
  for (let i = 0, n = rd(G_NCOINS); i < n; i++) {
    const c = COIN_BASE + i * COIN_N, kind = rd(c + C_KIND);
    const m = makeSprite(kind === SK_COIN ? S.coin[0] : kind === SK_GEM ? S.gem : S.heart, kind === SK_COIN ? 0.9 : 1, kind === SK_COIN ? 0.9 : 1, 0.2);
    Wd.coins.push({ mesh: m, ph: Math.random() * 6, kind, c });
  }
  for (let i = 0, n = rd(G_NEN); i < n; i++) {
    const b = EN_BASE + i * EN_N, kind = rd(b + E_KIND);
    let m;
    if (kind === EK_SLIME) m = makeSprite(S.slime, 1, 1, 0.3);
    else if (kind === EK_BAT) m = makeSprite(S.bat[0], 1, 1, 0.3);
    else if (kind === EK_SAW) m = makeSprite(S.saw, 1.1, 1.1, 0.3);
    else if (kind === EK_TURRET) m = makeSprite(S.turret, 1, 1, 0.3);
    else { m = makeSprite(S.boss, 3.1, 3.1, 0.3); m.visible = false; }
    Wd.enemies.push({ mesh: m, kind, b, hidden: false });
  }
  for (let i = 0, n = rd(G_NPLT); i < n; i++) {
    const p = PLT_BASE + i * PLT_N, crumble = rd(p + PT_KIND) === 2;
    const count = crumble ? 1 : 3, meshes = [];
    for (let k = 0; k < count; k++) meshes.push(makeSprite(slotTex(theme, crumble ? T.CRUMBLE : T.MOVER), 1, 1, 0.25));
    Wd.plats.push({ meshes, p, crumble });
  }
  for (let i = 0, n = rd(G_NSPR); i < n; i++) {
    const s = SPR_BASE + i * SPR_N;
    Wd.springs.push({ mesh: makeSprite(S.spring[0], 1, 1, 0.2), s });
  }
  for (let i = 0, n = rd(G_NCK); i < n; i++) {
    const c = CKT_BASE + i * CKT_N, cx = rd(c + CK_X), by = rd(c + CK_Y);
    const pole = makeSprite(S.flagPole, 1, 2, 0.1); pole.position.set(cx, by + 1, 0.1);
    const cloth = makeSprite(S.flagOff[0], 1, 1, 0.12); cloth.position.set(cx + 0.05, by + 1.35, 0.12);
    Wd.checks.push({ cloth, c, t: Math.random() * 3 });
  }
  if (rd(G_DOORON)) {
    for (let ty = rd(G_DOORY0); ty <= rd(G_DOORY1); ty++) {
      const m = makeSprite(slotTex(theme, T.DOOR), 1, 1, 0.4);
      m.position.set(rd(G_DOORX) + 0.5, ty + 0.5, 0.4); m.visible = false;
      Wd.doors.push(m);
    }
  }
}

function ensureGoal() {
  if (!Wd.goal && rd(G_GOALON)) {
    const m = makeSprite(Art.S.portal[0], 1.5, 2.25, 0.15);
    Wd.goal = { mesh: m };
  }
}

/* ---------------------------------------------------------------------
   11. GAME (host-side) STATE
   --------------------------------------------------------------------- */
const G = { state: 'boot', lvl: 0, anim: 0, clearT: 0, attractT: 0, camX: 0, camY: 7, showTitleCore: true };
const Pv = { mesh: null, sx: 1, sy: 1, runT: 0 };   // purely visual player state

const popupAtPlayer = (txt, color) => FX.popup(rd(P_X), rd(P_Y) + 1.4, txt, color);

/* ---------- core events -> sound, particles, popups ---------- */
function squash(sx, sy) { Pv.sx = sx; Pv.sy = sy; }

function processEvents() {
  const n = rd(G_EVN);
  for (let i = 0; i < n; i++) {
    const o = EV_BASE + i * EV_N;
    const t = rd(o), x = rd(o + 1), y = rd(o + 2), a = rd(o + 3);
    switch (t) {
      case EV_JUMP:
        Snd.play('jump'); squash(0.75, 1.3);
        FX.emit(x, y, 5, { colors: [0xffffff, 0xd9d0f5], angle: Math.PI / 2, spread: 1.4, speed: 3, life: 0.4, gravity: 3 });
        break;
      case EV_DOUBLE:
        Snd.play('double'); squash(0.8, 1.25);
        FX.emit(x, y, 10, { colors: [0x6fe7ff, 0xffffff], angle: -Math.PI / 2, spread: 1.2, speed: 4, life: 0.45, gravity: 2 });
        break;
      case EV_WALLJUMP:
        Snd.play('wall'); squash(0.8, 1.25);
        FX.emit(x, y, 6, { colors: [0xffffff], angle: a > 0 ? Math.PI : 0, spread: 1, speed: 3, life: 0.4, gravity: 4 });
        break;
      case EV_LAND:
        Snd.play('land'); squash(1.3, 0.72);
        FX.emit(x, y, 6, { colors: [0xffffff, 0xcfc4ee], angle: 0, spread: Math.PI, speed: 3.5, life: 0.35, gravity: 2 });
        break;
      case EV_DASH:
        Snd.play('dash');
        FX.emit(x, y, 8, { colors: [0x6fe7ff, 0xffffff], angle: a > 0 ? Math.PI : 0, spread: 0.5, speed: 6, gravity: 0, life: 0.35 });
        break;
      case EV_COIN:
        Snd.play('coin');
        FX.emit(x, y, 6, { colors: [0xffd23f, 0xfff2a8], speed: 4, life: 0.4, gravity: 0 });
        break;
      case EV_GEM:
        Snd.play('gem'); FX.popup(x, y + 0.5, '+5', '#6fe7ff');
        FX.emit(x, y, 16, { colors: [0x3fd4ff, 0xb8f4ff, 0xffffff], speed: 6, life: 0.6, gravity: 0 });
        break;
      case EV_HEART:
        Snd.play('heart'); FX.popup(x, y + 0.5, a ? '+1 HP' : '+250', '#ff8bd7');
        FX.emit(x, y, 12, { colors: [0xff4f78, 0xffc0d0], speed: 5, life: 0.6, gravity: 0 });
        break;
      case EV_KILL: {
        const dash = a >= 10, kind = a - (dash ? 10 : 0);
        Snd.play('stomp'); FX.popup(x, y + 0.5, '+150', '#ffffff');
        FX.emit(x, y, 16, { colors: kind === EK_SLIME ? [0x6be36a, 0xc4ffbd, 0x38a04a] : [0x8a4fd8, 0xff4060, 0xffffff], speed: 7, life: 0.7 });
        if (dash) FX.shake = Math.max(FX.shake, 0.3); else squash(0.8, 1.25);
        break;
      }
      case EV_HURT:
        Snd.play('hurt'); FX.shake = 0.55; FX.flash(0.55);
        FX.emit(x, y, 14, { colors: [0xff4f78, 0xffffff, 0xffd23f], speed: 7, life: 0.6 });
        break;
      case EV_DIE:
        Snd.play('die'); FX.shake = 0.9;
        FX.emit(x, y, 34, { colors: [0xff9d3c, 0xffffff, 0xff4f78, 0x3be0c8], speed: 9, life: 1, size: 0.24 });
        break;
      case EV_SPRING:
        Snd.play('spring');
        if (!a) { squash(0.7, 1.4); FX.emit(x, y, 10, { colors: [0xff5d8f, 0xffffff], angle: Math.PI / 2, spread: 0.9, speed: 6, life: 0.4 }); }
        break;
      case EV_SHOOT:
        Snd.play('shoot');
        FX.emit(x, y, 4, { colors: [0xffd23f, 0xff7a3d], angle: a > 0 ? 0 : Math.PI, spread: 0.6, speed: 4, life: 0.25, gravity: 0 });
        break;
      case EV_CHECK:
        Snd.play('check'); FX.popup(x, y + 2.4, 'CHECKPOINT', '#5be37d');
        FX.emit(x, y + 1.4, 20, { colors: [0x5be37d, 0xffffff, 0xffd23f], speed: 6, life: 0.7 });
        break;
      case EV_CRUMBLE:
        Snd.play('crumble');
        FX.emit(x, y, 12, { colors: [0xb98a5e, 0x7a5636, 0xf0cfa2], speed: 3, life: 0.7 });
        break;
      case EV_BOOM:
        Snd.play('boom'); FX.shake = 1;
        if (a === 2) FX.emit(x, y + 1, 18, { colors: [0xcfc4ee, 0xffffff], speed: 8, life: 0.5 });
        else FX.emit(x, y, a === 1 ? 24 : 20, { colors: [0xcfc4ee, 0xffffff], angle: 0, spread: Math.PI, speed: 8, life: 0.55, gravity: 3 });
        break;
      case EV_BOSSHIT:
        Snd.play('bossHit'); FX.shake = 0.8; FX.flash(0.5); squash(0.8, 1.25);
        FX.emit(x, y + 1.2, 22, { colors: [0xe58bff, 0xffffff, 0xb04fe8], speed: 9, life: 0.8, size: 0.26 });
        FX.popup(x, y + 3, a > 0 ? 'HP ' + a : 'K.O.!', '#ff8bd7');
        break;
      case EV_DOOR:
        Snd.play('door'); if (a) FX.shake = 0.8;
        break;
      case EV_PIT:
        Snd.play('hurt'); FX.flash(0.5); FX.shake = 0.5;
        break;
      case EV_RESPAWN:
        FX.emit(x, y, 16, { colors: [0xffffff, 0x6fe7ff, 0xffd23f], speed: 6, life: 0.6, gravity: 0 });
        if (a === 1) FX.popup(x, y + 1, 'OOPS', '#ff8bd7'); else snapCamera();
        break;
      case EV_COMPLETE:
        completeLevel();
        break;
      case EV_BOSSDEAD:
        Snd.play('boom'); FX.flash(1); FX.shake = 1.2;
        FX.emit(x, y + 1.2, 60, { colors: [0xffd23f, 0xff7a3d, 0xffffff, 0xe58bff, 0x6fe7ff], speed: 12, life: 1.2, size: 0.34 });
        FX.popup(x, y + 3, 'BOSS DEFEATED!', '#ffd23f');
        break;
      case EV_SHOTHIT:
        FX.emit(x, y, 6, { colors: a ? [0xe58bff, 0xffffff] : [0xff7a3d, 0xffd23f], speed: 4, life: 0.35 });
        break;
      case EV_BOSSEXPLODE:
        FX.emit(x, y, 6, { colors: [0xffd23f, 0xff7a3d, 0xffffff, 0xe58bff], speed: 7, life: 0.6, size: 0.3 });
        FX.shake = Math.max(FX.shake, 0.5);
        break;
      default: break;
    }
  }
}

/* ---------------------------------------------------------------------
   12. LEVEL FLOW
   --------------------------------------------------------------------- */
let levelMesh = null;

function loadLevel(i, attract) {
  clearWorld();
  FX.clear();
  const L = buildLevel(i);
  Wd.L = L; Wd.w = L.w; G.lvl = i;
  buildBackground(L.def.theme);
  resize();
  levelMesh = buildLevelMesh(L);
  simLoad(L, attract);
  buildEntities(L);
  ensureGoal();
  Pv.mesh = makeSprite(Art.S.hero.idle, 1, 1, 0.5);
  Pv.sx = Pv.sy = 1;
  Pv.mesh.visible = !attract;
  $('bossbar').style.display = 'none';
  snapCamera();
  Snd.startMusic(L.def.theme);
}

function startLevel(i) {
  Snd.init();
  Snd.play('click');
  loadLevel(i, false);
  G.state = 'play';
  hideScreen();
  $('hud').style.display = 'flex';
  $('hLevel').textContent = (i + 1) + '/' + LEVELS.length + ' ' + LEVELS[i].name.toUpperCase();
  FX.popup(rd(P_X), rd(P_Y) + 2.6, LEVELS[i].name.toUpperCase(), '#ffd23f');
}

function completeLevel() {
  if (G.state !== 'play') return;
  G.state = 'clearing';
  G.clearT = 1.5;
  Snd.play('win');
  FX.flash(0.6);
  for (let k = 0; k < 4; k++) {
    FX.emit(rd(P_X) + rndRange(-2, 2), rd(P_Y) + 2.5, 20, { colors: [0xffd23f, 0xff5d8f, 0x6fe7ff, 0x5be37d, 0xffffff], angle: Math.PI / 2, spread: 1.4, speed: 10, life: 1.4, size: 0.2, gravity: 10 });
  }
  $('bossbar').style.display = 'none';
}

function rankFor(pts) { return pts >= 85 ? 'S' : pts >= 68 ? 'A' : pts >= 50 ? 'B' : 'C'; }

function showClear() {
  G.state = 'clear';
  const time = rd(G_TIME), coins = rd(G_COINS), total0 = rd(G_COINSTOTAL), deaths = rd(G_DEATHS), kills = rd(G_KILLS);
  const par = Wd.w * 0.3;
  const timeBonus = Math.max(0, Math.floor(par * 2 - time)) * 10;
  const total = Math.max(0, rd(G_SCORE) + timeBonus - deaths * 200);
  const coinPct = coins / Math.max(1, total0);
  const timeScore = clamp((par * 1.8 - time) / (par * 0.8), 0, 1);
  const pts = coinPct * 55 + timeScore * 30 + (deaths === 0 ? 15 : deaths < 3 ? 7 : 0);
  const rank = rankFor(pts);
  const best = store.get('best', {});
  const prev = best[G.lvl];
  const isBest = !prev || total > prev.score;
  if (isBest) { best[G.lvl] = { score: total, time, rank }; store.set('best', best); }
  const last = G.lvl >= LEVELS.length - 1;
  showScreen(`<div class="panel">
    <h2>${last ? 'YOU BEAT THE GREAT BLOB!' : 'LEVEL CLEAR!'}</h2>
    <p class="sub">${LEVELS[G.lvl].name} &middot; simulated by ${simBe.name}</p>
    <div class="rank">${rank}</div>
    <div class="stats">
      <span>TIME</span><span>${fmtTime(time)}</span>
      <span>COINS</span><span>${coins} / ${total0}</span>
      <span>SLOPS SQUASHED</span><span>${kills}</span>
      <span>OOPSIES</span><span>${deaths}</span>
      <span>TIME BONUS</span><span>+${timeBonus}</span>
      <span>SCORE</span><span>${total}${isBest ? ' NEW BEST!' : ''}</span>
    </div>
    <div class="btns">
      ${last ? '<button class="pix" data-a="menu">Back to title</button>' : '<button class="pix" data-a="next">Next level</button>'}
      <button class="pix alt" data-a="retry">Replay</button>
      ${last ? '' : '<button class="pix alt" data-a="menu">Menu</button>'}
    </div>
    ${last ? '<p class="sub">Thanks for playing this slop. Now go touch grass.</p>' : ''}
  </div>`);
}

/* ---------------------------------------------------------------------
   13. SCREENS  (title screen has the CORE dropdown)
   --------------------------------------------------------------------- */
const ACTIONS = {
  next()   { startLevel(Math.min(G.lvl + 1, LEVELS.length - 1)); },
  retry()  { startLevel(G.lvl); },
  menu()   { showTitle(); },
  resume() { togglePause(); },
};
function showScreen(html) {
  const el = $('screen');
  el.innerHTML = html;
  el.classList.remove('hidden');
  el.querySelectorAll('[data-a]').forEach((b) => {
    b.addEventListener('click', () => {
      Snd.init();
      const a = b.dataset.a;
      if (a.startsWith('start:')) startLevel(parseInt(a.slice(6), 10));
      else if (ACTIONS[a]) ACTIONS[a]();
    });
  });
}
function hideScreen() { $('screen').classList.add('hidden'); }

function coreInfoHtml(be) {
  const kb = be.bytes ? (be.bytes / 1024).toFixed(be.bytes > 102400 ? 0 : 1) + ' KB wasm' : 'no wasm (plain JS)';
  return `<b>${be.name}</b><br>${kb} &middot; ${be.note || ''}`;
}

function showTitle() {
  loadLevel(0, true);
  G.state = 'title';
  G.attractT = 0;
  $('hud').style.display = 'none';
  $('bossbar').style.display = 'none';

  }).join('');

  showScreen(`<div class="panel">
    <h1>SLOP<br>RUNNER</h1>

    <div class="pick">
      <label for="coreSel">SIMULATION CORE (language)</label>
      <select id="coreSel">${opts}</select>
      <div class="info" id="coreInfo">${coreInfoHtml(simBe)}</div>
    </div>
    <div class="keys">
      <span><kbd>A</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&rarr;</kbd></span><span>Run</span>
      <span><kbd>SPACE</kbd> / <kbd>W</kbd></span><span>Jump (again in the air!)</span>
      <span><kbd>SHIFT</kbd> / <kbd>X</kbd></span><span>Dash</span>
      <span><kbd>S</kbd>+<kbd>JUMP</kbd></span><span>Drop through platforms</span>
      <span><kbd>P</kbd> <kbd>R</kbd> <kbd>M</kbd></span><span>Pause / Restart / Mute</span>
    </div>
    <div class="btns">${lvlBtns}</div>

  </div>`);
  $('coreSel').addEventListener('change', (e) => { selectCore(e.target.value); e.target.blur(); });
}

let coreSwitching = false;
async function selectCore(id) {
  if (coreSwitching) return;
  coreSwitching = true;
  const info = $('coreInfo'), sel = $('coreSel'), prev = simBe;
  const setBtns = (off) => document.querySelectorAll('#screen [data-lvl]').forEach((b) => { b.disabled = off; });
  setBtns(true);
  if (info) { info.classList.remove('err'); info.innerHTML = 'Loading <b>' + id + '</b>...'; }
  try {
    const be = await Backends.get(id);
    simBe = be;
    store.set('core', id);
    loadLevel(0, true);           // restart the attract-mode level on the new core
    if ($('coreInfo')) $('coreInfo').innerHTML = coreInfoHtml(be);
    if ($('coreSel')) $('coreSel').value = id;
  } catch (err) {
    console.error(err);
    simBe = prev;
    if (sel) sel.value = prev.id;
    if ($('coreInfo')) { $('coreInfo').classList.add('err'); $('coreInfo').textContent = 'Could not load ' + id + ': ' + (err && err.message ? err.message : err); }
  }
  setBtns(false);
  coreSwitching = false;
}

function togglePause() {
  if (G.state === 'play') {
    G.state = 'pause';
    Snd.duck(true);
    showScreen(`<div class="panel"><h2>PAUSED</h2>
      <p>Take a breather. The slimes will wait.</p>
      <div class="btns">
        <button class="pix" data-a="resume">Resume</button>
        <button class="pix alt" data-a="retry">Restart level</button>
        <button class="pix alt" data-a="menu">Quit to title</button>
      </div></div>`);
  } else if (G.state === 'pause') {
    G.state = 'play';
    Snd.duck(false);
    hideScreen();
  }
}

function toggleMute() {
  const m = Snd.toggleMute();
  $('muteBtn').textContent = m ? 'SND OFF' : 'SND ON';
}
$('muteBtn').addEventListener('click', () => { Snd.init(); toggleMute(); });
$('muteBtn').style.display = 'block';
$('muteBtn').textContent = Snd.muted ? 'SND OFF' : 'SND ON';

function handleKeys() {
  const pr = Input.pressed;
  if (pr.mute) toggleMute();
  if (pr.pause) togglePause();
  if (pr.restart && (G.state === 'play' || G.state === 'clearing')) startLevel(G.lvl);
  if (pr.confirm && !coreSwitching) {
    if (G.state === 'title') startLevel(0);
    else if (G.state === 'clear') ACTIONS[G.lvl >= LEVELS.length - 1 ? 'menu' : 'next']();
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') togglePause(); });
window.addEventListener('pointerdown', () => Snd.init());

/* ---------------------------------------------------------------------
   14. HUD
   --------------------------------------------------------------------- */
const hudCache = {};
function setHud(id, html) {
  if (hudCache[id] !== html) { hudCache[id] = html; $(id).innerHTML = html; }
}
function updateHud() {
  if (G.state === 'title' || G.state === 'boot') return;
  const hp = rd(P_HP), maxHp = rd(P_MAXHP);
  let hearts = '';
  for (let i = 0; i < maxHp; i++) hearts += i < hp ? '&#9829;' : '<span class="off">&#9829;</span>';
  setHud('hHearts', hearts);
  setHud('hCoins', '&#9679; ' + rd(G_COINS) + ' / ' + rd(G_COINSTOTAL));
  setHud('hTime', fmtTime(rd(G_TIME)));
  setHud('hScore', String(rd(G_SCORE)).padStart(6, '0'));
  const dashPct = rd(P_AIRDASH) ? 0 : clamp(1 - rd(P_DASHCD) / PLAYER.dashCooldown, 0, 1) * 100;
  const w = dashPct.toFixed(0) + '%';
  const bar = $('hDash');
  if (bar.style.width !== w) bar.style.width = w;
  // boss bar
  const bi = rd(G_BOSS);
  if (bi >= 0) {
    const active = rd(G_BOSSACTIVE) !== 0;
    const bb = $('bossbar');
    const want = active ? 'block' : 'none';
    if (bb.style.display !== want) bb.style.display = want;
    if (active) $('bossFill').style.width = Math.max(0, rd(EN_BASE + bi * EN_N + E_HP) / rd(EN_BASE + bi * EN_N + E_HP0) * 100) + '%';
  }
}

/* ---------------------------------------------------------------------
   15. VISUAL SYNC + CAMERA
   --------------------------------------------------------------------- */
function snapCamera() {
  G.camX = rd(P_X); G.camY = rd(P_Y) + 1.5;
  clampCamera();
}
function clampCamera() {
  const minX = view.w / 2, maxX = Wd.w - view.w / 2;
  G.camX = maxX < minX ? Wd.w / 2 : clamp(G.camX, minX, maxX);
  G.camY = view.h >= LEVEL_H ? LEVEL_H / 2 : clamp(G.camY, view.h / 2 - 0.4, LEVEL_H - view.h / 2);
}

function updateCamera(dt) {
  if (G.state === 'title') {
    G.attractT += dt;
    const k = (1 - Math.cos(G.attractT * 0.06)) / 2;
    G.camX = lerp(view.w / 2, Wd.w - view.w / 2, k);
    G.camY = 7;
  } else if (!rd(P_DEAD) || rd(P_DEADT) < 0.5) {
    const tx = rd(P_X) + rd(P_FACE) * 2.0, ty = rd(P_Y) + 1.6;
    const kx = 1 - Math.exp(-5 * dt), ky = 1 - Math.exp(-4 * dt);
    G.camX = lerp(G.camX, tx, kx);
    G.camY = lerp(G.camY, ty, ky);
  }
  clampCamera();
  const s = FX.shake * FX.shake;
  cam.position.x = G.camX + (Math.random() - 0.5) * s * 0.9;
  cam.position.y = G.camY + (Math.random() - 0.5) * s * 0.9;
  for (const l of bgLayerMeshes) {
    l.mesh.position.x = cam.position.x;
    l.mesh.position.y = cam.position.y;
    if (!l.sky) l.mesh.material.map.offset.x = (G.camX * l.par) / BG_TEX_W;
  }
}

function syncMeshes(dt) {
  const t = G.anim, S = Art.S;

  for (const c of Wd.coins) {
    const got = rd(c.c + C_GOT) !== 0;
    c.mesh.visible = !got;
    if (got) continue;
    const bob = Math.sin(t * 3 + c.ph) * 0.07;
    c.mesh.position.set(rd(c.c + C_X), rd(c.c + C_Y) + bob, 0.2);
    if (c.kind === SK_COIN) setTex(c.mesh, S.coin[Math.floor(t * 8 + c.ph) % 4]);
    else { const k = 1 + Math.sin(t * 5 + c.ph) * 0.08; c.mesh.scale.set(k, k, 1); }
  }

  for (const e of Wd.enemies) {
    const b = e.b, m = e.mesh, alive = rd(b + E_ALIVE) !== 0;
    if (e.kind === EK_BOSS) {
      const st = rd(b + E_STATE);
      m.visible = alive && st !== BS_SLEEP && (st !== BS_DYING || Math.floor(t * 30) % 2 === 0);
    } else m.visible = alive;
    if (!alive) continue;
    const x = rd(b + B_X), y = rd(b + B_Y), dir = rd(b + E_DIR), et = rd(b + E_T);
    if (e.kind === EK_SLIME) {
      const sq = Math.sin(et * 7) * 0.07;
      m.position.set(x, y + 0.5 - sq * 0.4, 0.3);
      m.scale.set(dir * (1 + sq), 1 - sq, 1);
    } else if (e.kind === EK_BAT) {
      setTex(m, S.bat[Math.floor(et * 9) % 2]);
      m.position.set(x, y + 0.05, 0.3);
      m.scale.set(dir >= 0 ? 1 : -1, 1, 1);
    } else if (e.kind === EK_SAW) {
      m.position.set(x, y + 0.4, 0.3);
      m.rotation.z -= Math.sign(rd(b + B_VX)) * dt * 9;
    } else if (e.kind === EK_TURRET) {
      m.position.set(x, y + 0.4, 0.3);
      m.scale.set(dir, 1, 1);
    } else {
      const st = rd(b + E_STATE), est = rd(b + E_ST), inv = rd(b + E_INV);
      let sq;
      if (st === BS_JUMP) sq = clamp(rd(b + B_VY) / 60, -0.25, 0.25) * 0.8;
      else if (st === BS_RECOVER) sq = -0.12 * Math.min(1, est * 2);
      else if (st === BS_CHARGE && est > 0.75) sq = Math.sin(t * 60) * 0.05;
      else sq = Math.sin(t * 5) * 0.04;
      m.position.set(x, y + 1.55 - sq * 1.2, 0.3);
      m.scale.set(3.1 * (1 - sq) * (dir >= 0 ? 1 : -1), 3.1 * (1 + sq), 1);
      const flashing = inv > 0 && Math.floor(t * 20) % 2 === 0;
      m.material.color.setHex(flashing ? 0xff8888 : st === BS_CHARGE && est > 0.75 ? 0xffb0b0 : 0xffffff);
    }
  }

  // shots: pool of meshes mirrors the core's shot list
  const ns = rd(G_NSH);
  while (Wd.shots.length < ns) Wd.shots.push(makeSprite(S.orbRed, 0.6, 0.6, 0.35));
  for (let i = 0; i < Wd.shots.length; i++) {
    const m = Wd.shots[i];
    if (i >= ns) { m.visible = false; continue; }
    const s = SH_BASE + i * SH_N, purple = rd(s + S_PURPLE) !== 0, size = rd(s + S_SIZE);
    setTex(m, purple ? S.orbPurple : S.orbRed);
    const k = size * (1 + Math.sin(t * 25) * 0.12);
    m.visible = true;
    m.position.set(rd(s + S_X), rd(s + S_Y), 0.35);
    m.scale.set(k, k, 1);
  }

  for (const p of Wd.plats) {
    const state = rd(p.p + PT_STATE), x = rd(p.p + PT_X), top = rd(p.p + PT_TOP), n = p.meshes.length;
    for (let i = 0; i < n; i++) {
      const m = p.meshes[i];
      m.visible = state !== CS_GONE;
      m.position.set(x + (i - (n - 1) / 2), top - 0.5, 0.25);
      if (state === CS_SHAKE) { m.position.x += (Math.random() - 0.5) * 0.08; m.position.y += (Math.random() - 0.5) * 0.06; }
    }
  }

  for (const s of Wd.springs) {
    setTex(s.mesh, S.spring[rd(s.s + SP_T) > 0 ? 1 : 0]);
    s.mesh.position.set(rd(s.s + SP_X), rd(s.s + SP_Y) + 0.5, 0.2);
  }

  for (const c of Wd.checks) {
    const f = Math.floor(t * 6 + c.t) % 4;
    setTex(c.cloth, rd(c.c + CK_ON) ? S.flagOn[f] : S.flagOff[f]);
  }

  for (let i = 0; i < Wd.doors.length; i++) Wd.doors[i].visible = rd(G_DOORCLOSED) !== 0;

  ensureGoal();
  if (Wd.goal) {
    const gx = rd(G_GOALX), gy = rd(G_GOALY);
    Wd.goal.mesh.position.set(gx, gy + 1.1 + Math.sin(t * 2) * 0.05, 0.15);
    setTex(Wd.goal.mesh, S.portal[Math.floor(t * 12) % 6]);
    if (Math.random() < 0.3) FX.emit(gx + rndRange(-0.6, 0.6), gy + rndRange(0.2, 2), 1, { colors: [0x6fe7ff, 0xff5d8f, 0xffffff], speed: 0.8, angle: Math.PI / 2, life: 0.9, gravity: -1, size: 0.14 });
  }

  // player sprite
  const dead = rd(P_DEAD) !== 0;
  if (Pv.mesh) {
    if (dead) { Pv.mesh.visible = false; }
    else {
      const px = rd(P_X), py = rd(P_Y), vx = rd(P_VX), vy = rd(P_VY), gnd = rd(P_GND) !== 0;
      const dashT = rd(P_DASHT), wallDir = rd(P_WALLDIR), face = rd(P_FACE), inv = rd(P_INV);
      let frame = 'idle';
      if (dashT > 0) frame = 'runA';
      else if (wallDir && !gnd && vy < 0) frame = 'wall';
      else if (!gnd) frame = vy > 0 ? 'jump' : 'fall';
      else if (Math.abs(vx) > 0.8) {
        Pv.runT += dt * (6 + Math.abs(vx));
        frame = Math.floor(Pv.runT / 3) % 2 ? 'runA' : 'runB';
        if (Math.random() < 0.08) FX.emit(px - face * 0.2, py + 0.05, 1, { colors: [0xffffff, 0xcfc4ee], speed: 1, angle: Math.PI / 2, life: 0.3, gravity: 1, size: 0.12 });
      }
      if (dashT > 0 && dt > 0) FX.emit(px, py + 0.45, 1, { colors: [0x6fe7ff, 0xb8f4ff], speed: 0.6, life: 0.35, size: 0.34, sizeMin: 0.28, gravity: 0 });
      if (wallDir && !gnd && vy < -3 && Math.random() < 0.15) FX.emit(px + wallDir * 0.3, py + 0.5, 1, { colors: [0xffffff], speed: 1, life: 0.3, gravity: -1, size: 0.1 });
      setTex(Pv.mesh, S.hero[frame]);
      Pv.sx = lerp(Pv.sx, 1, 1 - Math.exp(-14 * dt));
      Pv.sy = lerp(Pv.sy, 1, 1 - Math.exp(-14 * dt));
      const bob = frame === 'idle' ? Math.sin(t * 3) * 0.015 : 0;
      const dashStretch = dashT > 0 ? 1.25 : 1;
      const wallFace = frame === 'wall' ? -wallDir : face;
      Pv.mesh.scale.set(Pv.sx * dashStretch * (wallFace >= 0 ? 1 : -1), Pv.sy * (dashT > 0 ? 0.85 : 1), 1);
      Pv.mesh.position.set(px, py + 0.44 + bob + (Pv.sy - 1) * 0.5, 0.5);
      Pv.mesh.visible = inv > 0 ? Math.floor(t * 14) % 2 === 0 : true;
    }
  }
}

/* ---------------------------------------------------------------------
   16. MAIN LOOP
   --------------------------------------------------------------------- */
function writeInput() {
  wr(IN_AX, Input.axis);
  wr(IN_JUMPHELD, Input.held.jump ? 1 : 0);
  wr(IN_DOWNHELD, Input.held.down ? 1 : 0);
  if (Input.pressed.jump) wr(IN_JUMPPRESS, 1);
  if (Input.pressed.dash) wr(IN_DASHPRESS, 1);
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  Input.update();
  handleKeys();
  const running = G.state === 'play' || G.state === 'clearing' || G.state === 'title';
  if (running) {
    if (G.state !== 'title') writeInput();
    const t0 = performance.now();
    simBe.advance(rdt);
    simM = simBe.view();
    simStat.ms += performance.now() - t0; simStat.frames++;
    processEvents();
    if (G.state === 'clearing') { G.clearT -= rdt; if (G.clearT <= 0) showClear(); }
    G.anim += rdt;
    FX.update(rdt);
    syncMeshes(rdt);
    if (simStat.frames >= 90) {
      simStat.avg = simStat.ms / simStat.frames; simStat.ms = 0; simStat.frames = 0;
      $('core-badge').textContent = 'CORE ' + simBe.id.toUpperCase() + '  ' + (simStat.avg * 1000).toFixed(0) + ' us/frame';
    }
  }
  updateCamera(running ? rdt : 0);
  updateHud();
  renderer.render(scene, cam);
  Input.endFrame();
}

/* ---------------------------------------------------------------------
   17. BOOT
   --------------------------------------------------------------------- */
(async function boot() {
  const errs = validateChunks();
  Art.build();
  simBe = await Backends.get('js');
  simM = simBe.view();
  resize();
  showTitle();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  const want = new URLSearchParams(location.search).get('core') || store.get('core', 'js');
  if (want !== 'js' && Backends.list.some((b) => b.id === want)) selectCore(want);
  window.__slop = { G, Wd, LEVELS, loadLevel, startLevel, errs, rd, wr, selectCore, get be() { return simBe; } };
})();
</script>
